ont-family: var(--mono);\n  }\n\n  /* COMPARE LABELS */\n  #compare-labels {\n    position: absolute; top: 12px; left: 0; right: 0; pointer-events: none;\n    display: none; justify-content: space-around; z-index: 10;\n  }\n  #compare-labels.visible { display: flex; }\n  .compare-label {\n    background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--r-md);\n    padding: 5px 14px; font-size: 12px; color: var(--text); font-weight: 600;\n  }\n  #compare-divider {\n    position: absolute; top: 0; bottom: 0; left: 50%; width: 1px;\n    background: rgba(0,204,0,0.45); pointer-events: none; display: none;\n  }\n  #compare-divider.visible { display: block; }\n\n  /* SCENARIO LIST */\n  .sc-item {\n    display: flex; align-items: center; gap: 6px; padding: 6px 8px;\n    margin-bottom: 3px; border-radius: var(--r-sm); font-size: 12.5px;\n    background: var(--surface); border: 1px solid transparent;\n  }\n  .sc-item.active-sc { border-color: var(--border-strong); background: rgba(0,204,0,.1); }\n  .sc-item .sc-name {\n    flex: 1; background: none; border: none; color: var(--text-sec); font-size: 12.5px;\n    padding: 2px 4px; cursor: text; border-radius: 4px; min-width: 0;\n  }\n  .sc-item .sc-name:focus {\n    outline: 1px solid var(--primary); background: var(--input-bg); color: var(--text); box-shadow: none;\n  }\n  .sc-item.active-sc .sc-name { color: var(--primary); font-weight: 700; }\n  .sc-dot {\n    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;\n    background: transparent; border: 1.5px solid var(--text-mut); cursor: pointer; transition: .12s;\n  }\n  .sc-dot:hover { border-color: var(--primary); }\n  .sc-dot.on { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 8px rgba(0,204,0,.7); }\n  .sc-item button { background: none; border: none; color: var(--text-mut); cursor: pointer; font-size: 14px; width: auto; padding: 0 3px; margin: 0; flex-shrink: 0; display:inline-flex; align-items:center; }\n  .sc-item button:hover { color: var(--error); }\n  .sc-item button svg { width: 15px; height: 15px; }\n\n  /* WINDOW LIST */\n  .win-item { display: flex; align-items: center; gap: 6px; padding: 7px 8px; margin-bottom: 3px; border-radius: var(--r-sm); font-size: 12.5px; color: var(--text-sec); cursor: pointer; background: var(--surface); border: 1px solid transparent; transition: .12s; }\n  .win-item:hover { border-color: var(--border); color: var(--text); }\n  .win-item.selected { color: var(--cyan); border-color: rgba(0,204,255,.5); background: rgba(0,204,255,.08); }\n  .win-item .info { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }\n  .win-item .rm { background: none; border: none; color: var(--text-mut); cursor: pointer; font-size: 14px; width: auto; padding: 0 4px; margin: 0; flex-shrink: 0; }\n  .win-item .rm:hover { color: var(--error); }\n\n  #win-spec-panel { margin-bottom: 6px; }\n  #sun-info { font-size: 11px; color: var(--text-sec); margin-top: 8px; min-height: 15px; font-family: var(--mono); }\n  #autosave-status { font-family: var(--mono); }\n\n  input[type=\"file\"] { color: var(--text-mut); }\n  input[type=\"file\"]::file-selector-button {\n    background: var(--input-bg); border: 1px solid var(--border); color: var(--text-sec);\n    border-radius: var(--r-md); padding: 5px 12px; font-family: var(--sans); font-size: 11px; cursor: pointer; margin-right: 8px;\n  }\n  input[type=\"file\"]::file-selector-button:hover { border-color: var(--border-strong); color: var(--text); }\n\n  @media (max-width: 768px) {\n    body { overflow: hidden; }\n    #mobile-handle { display: block; }\n    #mobile-backdrop { display: block; }\n    #mobile-backdrop.active { opacity: 1; pointer-events: auto; }\n    #mobile-fab { display: flex; }\n    #sidebar {\n      position: fixed;\n      bottom: 0; left: 0; right: 0;\n      width: 100%; min-width: unset;\n      max-height: 80vh;\n      border-right: none;\n      border-top: 1px solid var(--border-strong);\n      border-radius: 20px 20px 0 0;\n      transform: translateY(100%);\n      transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);\n      z-index: 150;\n      overflow-y: auto;\n      -webkit-overflow-scrolling: touch;\n      box-shadow: 0 -6px 24px rgba(0,0,0,0.5);\n    }\n    #sidebar.mobile-open { transform: translateY(0); }\n    #sidebar h1 { display: none; }\n    #main { width: 100%; height: 100vh; }\n    #toolbar {\n      overflow-x: auto;\n      flex-wrap: nowrap;\n      -webkit-overflow-scrolling: touch;\n      padding: 8px 10px;\n      gap: 6px;\n    }\n    #toolbar .tool-btn { white-space: nowrap; padding: 8px 12px; }\n    #cursor-info { display: none; }\n    input[type=\"number\"], input[type=\"text\"], select { font-size: 16px !important; }\n    button { min-height: 40px; }\n    .tool-btn { min-height: 36px; }\n    input[type=\"number\"] { width: 88px; padding: 6px 9px; }\n    #lux-cursor { top: 60px; }\n    #stats-panel { bottom: 84px; }\n    #legend { bottom: 84px; }\n  }\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div id=\"sidebar\">\n  <div id=\"mobile-handle\"><\u002Fdiv>\n  <h1>Light Simulator<\u002Fh1>\n\n  <div class=\"section\">\n    <h2>Room / Area<\u002Fh2>\n    <label class=\"open-area-toggle\">\n      <input type=\"checkbox\" id=\"openArea\"> Open area (no walls)\n    <\u002Flabel>\n    <div id=\"room-dims\">\n      <label>Width  <input type=\"number\" id=\"roomW\" value=\"10\" min=\"1\" max=\"500\" step=\"0.5\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Depth  <input type=\"number\" id=\"roomD\" value=\"8\" min=\"1\" max=\"500\" step=\"0.5\"> <span>m<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div id=\"open-dims\" class=\"hidden\">\n      <label>Area Width <input type=\"number\" id=\"areaW\" value=\"30\" min=\"5\" max=\"1000\" step=\"1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Area Depth <input type=\"number\" id=\"areaD\" value=\"30\" min=\"5\" max=\"1000\" step=\"1\"> <span>m<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <label>Work-plane ht. <input type=\"number\" id=\"workPlane\" value=\"0.85\" min=\"0\" max=\"5\" step=\"0.05\"> <span>m<\u002Fspan><\u002Flabel>\n    <label id=\"room-h-label\">Room height <input type=\"number\" id=\"roomH\" value=\"3.0\" min=\"1.5\" max=\"20\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n    <div style=\"margin-top:6px;\">\n      <label style=\"display:block;font-size:11px;color:var(--text-mut);margin-bottom:6px;\">Floor plan image<\u002Flabel>\n      <input type=\"file\" id=\"bgImageFile\" accept=\"image/*\" aria-label=\"Upload floor plan image\" style=\"font-size:11px;color:var(--text-sec);width:100%;background:none;border:none;padding:0;cursor:pointer;\">\n      <div style=\"display:flex;gap:4px;margin-top:4px;align-items:center;\">\n        <label style=\"font-size:11px;color:var(--text-sec);margin:0;flex:1;\">Opacity\n          <input type=\"range\" id=\"bgOpacity\" min=\"5\" max=\"80\" value=\"30\" style=\"flex:1;margin:0;\">\n        <\u002Flabel>\n        <button id=\"btn-clear-bg\" class=\"btn-secondary\" aria-label=\"Clear floor plan image\" title=\"Clear image\" style=\"width:auto;padding:2px 8px;font-size:10px;margin:0;\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <label style=\"margin-top:4px;\">Scale <input type=\"number\" id=\"bgScale\" value=\"100\" min=\"10\" max=\"400\" step=\"5\"> <span>%<\u002Fspan><\u002Flabel>\n      <label>Offset X <input type=\"number\" id=\"bgOffX\" value=\"0\" min=\"-200\" max=\"200\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Offset Y <input type=\"number\" id=\"bgOffY\" value=\"0\" min=\"-200\" max=\"200\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section\" id=\"reflectance-section\">\n    <h2>Surface Reflectances<\u002Fh2>\n    <div style=\"display:flex;gap:4px;margin-bottom:8px;\">\n      <button class=\"btn-secondary\" style=\"flex:1;margin:0;font-size:10px;\" onclick=\"applyReflPreset(0.8,0.5,0.2)\">Office<\u002Fbutton>\n      <button class=\"btn-secondary\" style=\"flex:1;margin:0;font-size:10px;\" onclick=\"applyReflPreset(0.9,0.8,0.7)\">White Studio<\u002Fbutton>\n      <button class=\"btn-secondary\" style=\"flex:1;margin:0;font-size:10px;\" onclick=\"applyReflPreset(0.1,0.1,0.05)\">Dark Room<\u002Fbutton>\n    <\u002Fdiv>\n    <label>Ceiling refl. <input type=\"number\" id=\"reflCeil\" value=\"0.8\" min=\"0\" max=\"0.99\" step=\"0.05\"> <span>ρ<\u002Fspan><\u002Flabel>\n    <label>Walls refl.   <input type=\"number\" id=\"reflWalls\" value=\"0.5\" min=\"0\" max=\"0.99\" step=\"0.05\"> <span>ρ<\u002Fspan><\u002Flabel>\n    <label>Floor refl.   <input type=\"number\" id=\"reflFloor\" value=\"0.2\" min=\"0\" max=\"0.99\" step=\"0.05\"> <span>ρ<\u002Fspan><\u002Flabel>\n    <label>Bounces <input type=\"number\" id=\"reflBounces\" value=\"3\" min=\"1\" max=\"8\" step=\"1\"> <span>passes<\u002Fspan><\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"section\" id=\"geometry-section\">\n    <h2>Room Geometry<\u002Fh2>\n    <div style=\"display:flex;gap:4px;margin-bottom:6px;\">\n      <button class=\"btn-secondary\" style=\"flex:1;margin:0;font-size:10px;\" onclick=\"clearRoomPolygon()\">Clear Polygon<\u002Fbutton>\n      <button class=\"btn-secondary\" id=\"btn-close-poly\" style=\"flex:1;margin:0;font-size:10px;display:none;\" onclick=\"closeRoomPolygon()\">Close Shape<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"poly-info\" style=\"font-size:11px;color:var(--text-sec);margin-bottom:6px;\">No polygon — using rectangle<\u002Fdiv>\n    <div id=\"wall-list\" style=\"font-size:11px;color:var(--text-mut);\">No internal walls<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <h2 id=\"spec-title\">Light Spec <em id=\"spec-editing\"><\u002Fem><\u002Fh2>\n\n    <label style=\"font-size:11px;color:var(--text-mut);\">\n      Source shape\n      <select id=\"shape\">\n        <option value=\"point\">Point (bulb / spot / downlight)<\u002Foption>\n        <option value=\"linear\">Linear (strip / batten)<\u002Foption>\n      <\u002Fselect>\n    <\u002Flabel>\n    <div id=\"linear-opts\" class=\"hidden\">\n      <label>Length   <input type=\"number\" id=\"lightLength\" value=\"1.2\" min=\"0.1\" max=\"50\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Rotation <input type=\"number\" id=\"lightRotation\" value=\"0\" min=\"0\" max=\"359\" step=\"5\">  <span>°<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"height:6px\"><\u002Fdiv>\n\n    <label>Lumens      <input type=\"number\" id=\"lumens\" value=\"3000\" min=\"100\" max=\"100000\" step=\"100\"> <span>lm<\u002Fspan><\u002Flabel>\n    <label>Beam angle  <input type=\"number\" id=\"beamAngle\" value=\"120\" min=\"5\" max=\"360\" step=\"5\">   <span>°<\u002Fspan><\u002Flabel>\n    <label>Mount height<input type=\"number\" id=\"mountH\" value=\"3.0\" min=\"0.5\" max=\"30\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n    <label>Color temp  <input type=\"number\" id=\"cct\" value=\"4000\" min=\"1800\" max=\"8000\" step=\"100\"> <span>K<\u002Fspan><\u002Flabel>\n    <label>LLF         <input type=\"number\" id=\"llf\" value=\"0.8\" min=\"0.1\" max=\"1.0\" step=\"0.05\"><span>LLF<\u002Fspan><\u002Flabel>\n    <label style=\"font-size:11px;color:var(--text-mut);margin-top:2px;\">\n      Distribution\n      <select id=\"distrib\">\n        <option value=\"lambertian\">Lambertian (general diffuse)<\u002Foption>\n        <option value=\"batwing\">Batwing (recessed panel)<\u002Foption>\n        <option value=\"spot\">Spot / narrow beam<\u002Foption>\n      <\u002Fselect>\n    <\u002Flabel>\n    <div style=\"height:4px\"><\u002Fdiv>\n    <label>Tilt angle <input type=\"number\" id=\"aimTilt\" value=\"0\" min=\"0\" max=\"89\" step=\"1\"> <span>°<\u002Fspan><\u002Flabel>\n    <label id=\"aim-az-row\">Rotation <input type=\"number\" id=\"aimAz\" value=\"0\" min=\"0\" max=\"359\" step=\"5\"> <span>°<\u002Fspan><\u002Flabel>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <h2>Lights in scene<\u002Fh2>\n    <ul id=\"light-list\" class=\"item-list\"><\u002Ful>\n    <button class=\"btn-secondary\" id=\"btn-add-mode\">Place Light<\u002Fbutton>\n    <button class=\"btn-secondary\" id=\"btn-array-toggle\" style=\"margin-top:4px;\">Place Array<\u002Fbutton>\n    <div id=\"array-panel\">\n      <label>Rows    <input type=\"number\" id=\"arrRows\" value=\"2\" min=\"1\" max=\"20\" step=\"1\"> <span><\u002Fspan><\u002Flabel>\n      <label>Cols    <input type=\"number\" id=\"arrCols\" value=\"3\" min=\"1\" max=\"20\" step=\"1\"> <span><\u002Fspan><\u002Flabel>\n      <label>Spacing X <input type=\"number\" id=\"arrSpX\" value=\"2.5\" min=\"0.1\" max=\"50\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Spacing Y <input type=\"number\" id=\"arrSpY\" value=\"2.5\" min=\"0.1\" max=\"50\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <button class=\"btn-primary\" id=\"btn-array-place\" style=\"margin-top:4px;\">Place Centre<\u002Fbutton>\n    <\u002Fdiv>\n    <button class=\"btn-danger\" id=\"btn-clear-lights\" style=\"margin-top:4px;\">Remove all lights<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <h2>Scenarios<\u002Fh2>\n    <div id=\"scenario-list\" style=\"margin-bottom:4px;\"><\u002Fdiv>\n    <button class=\"btn-secondary\" id=\"btn-add-scenario\" style=\"margin-bottom:6px;\">Add Scenario<\u002Fbutton>\n    <div id=\"compare-controls\" style=\"display:none;\">\n      <div style=\"font-size:11px;color:var(--text-sec);margin-bottom:4px;\">Side-by-side compare:<\u002Fdiv>\n      <label style=\"font-size:11px;\">Left &nbsp;<select id=\"compare-left-sel\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:11px;padding:2px 4px;\"><\u002Fselect><\u002Flabel>\n      <label style=\"font-size:11px;margin-top:4px;\">Right <select id=\"compare-right-sel\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:11px;padding:2px 4px;margin-left:2px;\"><\u002Fselect><\u002Flabel>\n      <button class=\"btn-primary\" id=\"btn-simulate-compare\" style=\"margin-top:6px;\">Simulate &amp; Compare<\u002Fbutton>\n      <button class=\"btn-secondary\" id=\"btn-exit-compare\" style=\"margin-top:4px;display:none;\">Exit Compare<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <h2>Windows &amp; Daylight<\u002Fh2>\n    <div id=\"win-spec-panel\">\n      <label>Wall <select id=\"win-wall\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:12px;padding:2px 4px;margin-left:auto;\">\n        <option value=\"N\">North (top)<\u002Foption><option value=\"S\">South (bottom)<\u002Foption>\n        <option value=\"E\">East (right)<\u002Foption><option value=\"W\">West (left)<\u002Foption>\n      <\u002Fselect><\u002Flabel>\n      <label>Position from corner <input type=\"number\" id=\"win-pos\" value=\"1\" min=\"0\" max=\"200\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Width  <input type=\"number\" id=\"win-width\" value=\"1.5\" min=\"0.1\" max=\"50\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Height <input type=\"number\" id=\"win-height\" value=\"1.2\" min=\"0.1\" max=\"10\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Sill height <input type=\"number\" id=\"win-sill\" value=\"0.9\" min=\"0\" max=\"10\" step=\"0.1\"> <span>m<\u002Fspan><\u002Flabel>\n      <label>Transmittance <input type=\"number\" id=\"win-transmit\" value=\"0.7\" min=\"0.05\" max=\"1.0\" step=\"0.05\"> <span>τ<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <button class=\"btn-secondary\" id=\"btn-place-window-mode\" style=\"margin-bottom:2px;\">Place Window<\u002Fbutton>\n    <div style=\"font-size:10px;color:var(--text-mut);margin-bottom:4px;\">Or add manually<\u002Fdiv>\n    <button class=\"btn-secondary\" id=\"btn-add-window\" style=\"margin-bottom:4px;\">Add Window<\u002Fbutton>\n    <ul id=\"window-list\" class=\"item-list\" style=\"margin-top:0;\"><\u002Ful>\n\n    <div style=\"height:8px;border-top:1px solid #252525;margin-top:6px;\"><\u002Fdiv>\n    <h2 style=\"margin-bottom:8px;\">Sun / Sky Config<\u002Fh2>\n    <label>Date <input type=\"date\" id=\"sun-date\" value=\"2024-06-21\" style=\"margin-left:auto;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:12px;padding:3px 5px;\"><\u002Flabel>\n    <label>Solar time <input type=\"number\" id=\"sun-time\" value=\"12\" min=\"0\" max=\"24\" step=\"0.25\"> <span>h<\u002Fspan><\u002Flabel>\n    <label>North angle <input type=\"number\" id=\"sun-north\" value=\"0\" min=\"0\" max=\"359\" step=\"5\"> <span>° (0 = top is N)<\u002Fspan><\u002Flabel>\n    <div style=\"display:flex;gap:4px;margin-top:2px;\">\n      <label style=\"flex:1;font-size:11px;\">Lat <input type=\"number\" id=\"sun-lat\" value=\"51.5\" min=\"-90\" max=\"90\" step=\"0.1\" style=\"width:64px;font-size:12px;\"> <span>°<\u002Fspan><\u002Flabel>\n      <label style=\"flex:1;font-size:11px;\">Lon <input type=\"number\" id=\"sun-lon\" value=\"-0.1\" min=\"-180\" max=\"180\" step=\"0.1\" style=\"width:64px;font-size:12px;\"> <span>°<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <button class=\"btn-secondary\" id=\"btn-pick-location\" style=\"margin-top:4px;font-size:11px;\">Pick on Map<\u002Fbutton>\n    <div id=\"sun-info\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <h2>Measurement pins<\u002Fh2>\n    <ul id=\"pin-list\" class=\"item-list\"><\u002Ful>\n    <button class=\"btn-secondary\" id=\"btn-pin-mode\" disabled=\"\">Place Pin<\u002Fbutton>\n    <button class=\"btn-danger\" id=\"btn-clear-pins\" style=\"margin-top:4px;\">Remove all pins<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"section\">\n    <button class=\"btn-primary\" id=\"btn-simulate\">Simulate<\u002Fbutton>\n\n    <label style=\"margin-top:10px;\">\n      Lux scale\n      <select id=\"luxScale\">\n        <option value=\"auto\">Auto (relative to max)<\u002Foption>\n        <option value=\"50\">0 – 50 lux &nbsp;(dim / storage)<\u002Foption>\n        <option value=\"100\">0 – 100 lux &nbsp;(corridors)<\u002Foption>\n        <option value=\"200\">0 – 200 lux &nbsp;(lobbies)<\u002Foption>\n        <option value=\"300\">0 – 300 lux &nbsp;(retail / casual)<\u002Foption>\n        <option value=\"500\" selected=\"\">0 – 500 lux &nbsp;(office / EN 12464)<\u002Foption>\n        <option value=\"750\">0 – 750 lux &nbsp;(detailed tasks)<\u002Foption>\n        <option value=\"1000\">0 – 1000 lux &nbsp;(demanding / sport)<\u002Foption>\n        <option value=\"custom\">Custom…<\u002Foption>\n      <\u002Fselect>\n    <\u002Flabel>\n    <label id=\"custom-lux-row\" class=\"hidden\">\n      Max lux <input type=\"number\" id=\"customLuxMax\" value=\"500\" min=\"10\" max=\"50000\" step=\"50\"> <span>lux<\u002Fspan>\n    <\u002Flabel>\n\n    <div style=\"height:6px\"><\u002Fdiv>\n    <div class=\"toggle-row\">\n      <input type=\"checkbox\" id=\"showTarget\">\n      <label for=\"showTarget\" style=\"margin:0;color:var(--text);\">Below-target overlay<\u002Flabel>\n    <\u002Fdiv>\n    <label id=\"target-lux-row\" class=\"hidden\">\n      Target lux <input type=\"number\" id=\"targetLux\" value=\"300\" min=\"1\" max=\"10000\" step=\"10\"> <span>lux<\u002Fspan>\n    <\u002Flabel>\n\n    <div class=\"toggle-row\" style=\"margin-top:4px;\">\n      <input type=\"checkbox\" id=\"showContours\">\n      <label for=\"showContours\" style=\"margin:0;color:var(--text);\">Isolux contours<\u002Flabel>\n    <\u002Fdiv>\n    <label id=\"contour-levels-row\" class=\"hidden\" style=\"font-size:11px;color:var(--text-mut);\">\n      Levels (comma-sep)\n      <input type=\"text\" id=\"contourLevels\" value=\"100,300,500\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:11px;padding:3px 6px;width:120px;\">\n    <\u002Flabel>\n\n    <div class=\"toggle-row\" style=\"margin-top:4px;\">\n      <input type=\"checkbox\" id=\"showEmerg\">\n      <label for=\"showEmerg\" style=\"margin:0;color:var(--text);\">Emergency lighting check<\u002Flabel>\n    <\u002Fdiv>\n    <label id=\"emerg-std-row\" class=\"hidden\" style=\"font-size:11px;color:var(--text-mut);\">\n      Standard\n      <select id=\"emergStd\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:11px;padding:2px 4px;margin-left:auto;\">\n        <option value=\"0.5\">EN 1838 Anti-panic (0.5 lx)<\u002Foption>\n        <option value=\"1\" selected=\"\">EN 1838 Escape route (1 lx)<\u002Foption>\n        <option value=\"15\">EN 1838 High risk (15 lx)<\u002Foption>\n        <option value=\"10.76\">NFPA 101 (10.76 lx)<\u002Foption>\n      <\u002Fselect>\n    <\u002Flabel>\n\n    <div style=\"display:flex;gap:4px;margin-top:8px;\">\n      <button class=\"btn-secondary\" id=\"btn-save-json\" style=\"flex:1;margin:0;font-size:11px;\">Save<\u002Fbutton>\n      <button class=\"btn-secondary\" id=\"btn-load-json\" style=\"flex:1;margin:0;font-size:11px;\">Load<\u002Fbutton>\n      <input type=\"file\" id=\"load-json-file\" accept=\".json\" style=\"display:none;\">\n    <\u002Fdiv>\n    <div id=\"autosave-status\" style=\"font-size:10px;color:var(--text-mut);text-align:right;margin-top:2px;margin-bottom:4px;\">Auto-save: ready<\u002Fdiv>\n    <button class=\"btn-success\" id=\"btn-export\" style=\"margin-top:0;\">Export PNG<\u002Fbutton>\n    <label style=\"margin-top:8px;font-size:11px;color:var(--text-mut);\">\n      Project title\n      <input type=\"text\" id=\"projectTitle\" value=\"Light Simulation\" style=\"background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:4px;font-size:11px;padding:3px 6px;width:140px;\">\n    <\u002Flabel>\n    <button class=\"btn-secondary\" id=\"btn-reset-view\" style=\"margin-top:4px;\">Reset view<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"main\">\n  <div id=\"toolbar\">\n    <button class=\"tool-btn active\" id=\"tool-select\">Select / Move<\u002Fbutton>\n    <button class=\"tool-btn\" id=\"tool-place\">Place Light<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <button class=\"tool-btn\" id=\"tool-pin\" disabled=\"\">Place Pin<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <button class=\"tool-btn\" id=\"tool-ruler\">Ruler<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <button class=\"tool-btn\" id=\"tool-draw-room\">Draw Room<\u002Fbutton>\n    <button class=\"tool-btn\" id=\"tool-edit-room\">Edit Corners<\u002Fbutton>\n    <button class=\"tool-btn\" id=\"tool-draw-wall\">Add Wall<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <button class=\"tool-btn\" id=\"tool-place-window\">Place Window<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <button class=\"tool-btn\" id=\"btn-undo\" disabled=\"\" title=\"Undo (Ctrl+Z)\">Undo<\u002Fbutton>\n    <button class=\"tool-btn\" id=\"btn-redo\" disabled=\"\" title=\"Redo (Ctrl+Shift+Z)\">Redo<\u002Fbutton>\n    <div class=\"toolbar-sep\"><\u002Fdiv>\n    <label class=\"toolbar-grid-label\">Grid <select id=\"grid-snap-select\">\n      <option value=\"0.1\">10 cm<\u002Foption>\n      <option value=\"0.25\" selected=\"\">25 cm<\u002Foption>\n      <option value=\"0.5\">50 cm<\u002Foption>\n      <option value=\"1\">1 m<\u002Foption>\n    <\u002Fselect><\u002Flabel>\n    <span id=\"cursor-info\">Hover canvas for position<\u002Fspan>\n  <\u002Fdiv>\n  <div id=\"canvas-wrap\">\n    <canvas id=\"canvas\"><\u002Fcanvas>\n    <div id=\"legend\">\n      <h3>Illuminance (lux)<\u002Fh3>\n      <canvas id=\"legend-bar\" width=\"160\" height=\"14\"><\u002Fcanvas>\n      <div class=\"legend-labels\">\n        <span>0<\u002Fspan>\n        <span id=\"lux-q1\"><\u002Fspan>\n        <span id=\"lux-mid\"><\u002Fspan>\n        <span id=\"lux-q3\"><\u002Fspan>\n        <span id=\"lux-max\">—<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"lux-cursor\"><\u002Fdiv>\n    <div id=\"stats-panel\">\n      <h3>Simulation Stats<\u002Fh3>\n      <div class=\"stat-row\"><span>Max<\u002Fspan><span id=\"stat-max\" class=\"stat-val\">—<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-row\"><span>Avg<\u002Fspan><span id=\"stat-avg\" class=\"stat-val\">—<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-row\"><span>Min<\u002Fspan><span id=\"stat-min\" class=\"stat-val\">—<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-row\"><span>Uniformity (min/avg)<\u002Fspan><span id=\"stat-uni\" class=\"stat-val\">—<\u002Fspan><\u002Fdiv>\n      <div class=\"stat-row\" id=\"stat-emerg-row\" style=\"display:none;\"><span id=\"stat-emerg-label\">Compliant area<\u002Fspan><span id=\"stat-emerg\" class=\"stat-val\">—<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"ruler-readout\"><\u002Fdiv>\n    <div id=\"compare-labels\">\n      <span class=\"compare-label\" id=\"compare-label-left\">Scenario A<\u002Fspan>\n      <span class=\"compare-label\" id=\"compare-label-right\">Scenario B<\u002Fspan>\n    <\u002Fdiv>\n    <div id=\"compare-divider\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"map-modal\">\n  <div id=\"map-modal-inner\">\n    <h3>Pick Location — click map to set latitude / longitude<\u002Fh3>\n    <div id=\"leaflet-map\"><\u002Fdiv>\n    <div id=\"map-modal-footer\">\n      <span id=\"map-coords\">No location selected — click the map<\u002Fspan>\n      <button class=\"btn-secondary\" id=\"btn-close-map\" style=\"width:auto;padding:4px 14px;margin:0;font-size:12px;\">Close<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"mobile-backdrop\"><\u002Fdiv>\n<button id=\"mobile-fab\" aria-label=\"Toggle controls\"><svg viewBox=\"0 0 512 512\" width=\"1em\" height=\"1em\" fill=\"currentColor\" style=\"pointer-events:none\"><path d=\"M256 176a80 80 0 1080 80 80 80 0 00-80-80zm198 0-33-10-19-46 16-31a12 12 0 00-2-14l-33-33a12 12 0 00-14-2l-31 16-46-19-10-33a12 12 0 00-12-9h-46a12 12 0 00-12 9l-10 33-46 19-31-16a12 12 0 00-14 2l-33 33a12 12 0 00-2 14l16 31-19 46-33 10a12 12 0 00-9 12v46a12 12 0 009 12l33 10 19 46-16 31a12 12 0 002 14l33 33a12 12 0 0014 2l31-16 46 19 10 33a12 12 0 0012 9h46a12 12 0 0012-9l10-33 46-19 31 16a12 12 0 0014-2l33-33a12 12 0 002-14l-16-31 19-46 33-10a12 12 0 009-12v-46a12 12 0 00-9-12z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n\n<script>\nconst state = {\n  lights:    [],\n  pins:      [],\n  nextLightId: 1,\n  nextPinId:   1,\n  selectedLightId: null,\n  selectedPinId:   null,\n  mode: 'select',\n  heatmap:  null,\n  rawGrid:  null,\n  maxLux:   0,\n  minLux:   0,\n  avgLux:   0,\n  panX: 0, panY: 0, zoom: 1,\n  dragging: null,\n  panning:  null,\n  simulated: false,\n  ruler: null,\n  rulerDragging: false,\n  bgImage: null,\n  arrayPreview: null,\n  roomPolygon: [],\n  wallSegments: [],\n  nextWallId: 1,\n  drawingWall: null,\n  selectedWallId: null,\n  draggingVertex: null,\n  hoveredVertex: null,\n  mouseWorld: { x: 0, y: 0 },\n  windows: [],\n  nextWindowId: 1,\n  selectedWindowId: null,\n  windowSnap: null,\n  scenarios: [],\n  nextScenarioId: 1,\n  activeScenarioId: null,\n  compareMode: false,\n  compareLeftId: null,\n  compareRightId: null,\n  simResults: {},\n  sunConfig: {\n    lat: 51.5, lon: -0.1,\n    date: new Date().toISOString().slice(0, 10),\n    time: 12, northAngle: 0, transmittance: 0.7,\n  },\n  get openArea() { return document.getElementById('openArea').checked; },\n};\n\nconst wrap   = document.getElementById('canvas-wrap');\nconst canvas = document.getElementById('canvas');\nconst ctx    = canvas.getContext('2d');\n\nfunction resize() { canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight; draw(); }\nwindow.addEventListener('resize', resize);\n\nfunction roomW()     { return parseFloat(document.getElementById(state.openArea ? 'areaW' : 'roomW').value) || 10; }\nfunction roomD()     { return parseFloat(document.getElementById(state.openArea ? 'areaD' : 'roomD').value) || 10; }\nfunction workPlane() { return parseFloat(document.getElementById('workPlane').value) || 0.85; }\nfunction roomH()     { return parseFloat(document.getElementById('roomH').value)     || 3.0; }\nfunction reflCeil()  { const v = parseFloat(document.getElementById('reflCeil').value);  return isNaN(v) ? 0.8 : v; }\nfunction reflWalls() { const v = parseFloat(document.getElementById('reflWalls').value); return isNaN(v) ? 0.5 : v; }\nfunction reflFloor() { const v = parseFloat(document.getElementById('reflFloor').value); return isNaN(v) ? 0.2 : v; }\n\nfunction fitView() {\n  const pad = 70, rw = roomW(), rd = roomD();\n  state.zoom = Math.min((canvas.width - pad*2) / rw, (canvas.height - pad*2) / rd);\n  state.panX = (canvas.width  - rw * state.zoom) / 2;\n  state.panY = (canvas.height - rd * state.zoom) / 2;\n}\nfunction w2c(wx, wy) { return [wx * state.zoom + state.panX, wy * state.zoom + state.panY]; }\nfunction c2w(cx, cy) { return [(cx - state.panX) / state.zoom, (cy - state.panY) / state.zoom]; }\n\nfunction luxToColor(lux, maxLux) {\n  if (maxLux === 0) return [0,0,0];\n  const t = Math.min(lux / maxLux, 1);\n  const stops = [\n    [0,    [  0,  0,  0]],\n    [0.12, [  0,  0,110]],\n    [0.30, [  0, 80,200]],\n    [0.50, [  0,190, 90]],\n    [0.70, [200,230,  0]],\n    [0.88, [255,190, 30]],\n    [1.0,  [255,255,255]],\n  ];\n  for (let i = 1; i < stops.length; i++) {\n    if (t <= stops[i][0]) {\n      const f  = (t - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);\n      const c0 = stops[i-1][1], c1 = stops[i][1];\n      return [Math.round(c0[0]+f*(c1[0]-c0[0])), Math.round(c0[1]+f*(c1[1]-c0[1])), Math.round(c0[2]+f*(c1[2]-c0[2]))];\n    }\n  }\n  return [255,255,100];\n}\n\nfunction cctTint(K) {\n  if (K < 3000) return [1.0,0.87,0.65];\n  if (K < 4000) return [1.0,0.94,0.80];\n  if (K < 5000) return [1.0,0.98,0.95];\n  if (K < 6500) return [0.96,0.98,1.0];\n  return [0.88,0.93,1.0];\n}\n\nfunction intensityAtAngle(theta, beamAngle, distrib) {\n  const halfBeam = (beamAngle / 2) * Math.PI / 180;\n  if (theta >= halfBeam || theta >= Math.PI / 2) return 0;\n  const edgeStart = halfBeam * 0.75;\n  const edge = theta > edgeStart\n    ? Math.cos((theta - edgeStart) / (halfBeam - edgeStart) * Math.PI / 2)\n    : 1.0;\n  switch (distrib) {\n    case 'lambertian': return Math.cos(theta) * edge;\n    case 'batwing': {\n      const peak = 35 * Math.PI / 180;\n      return Math.max(0, Math.cos(theta) * (1 + 1.5*Math.sin(theta)*Math.exp(-2*Math.pow(theta-peak,2)))) * edge;\n    }\n    case 'spot':\n      return Math.pow(Math.cos(theta / halfBeam * Math.PI / 2), 3);\n    default: return Math.cos(theta) * edge;\n  }\n}\n\nfunction getLightSamples(L) {\n  if (L.shape !== 'linear') return [{ x: L.x, y: L.y, lm: L.lumens }];\n  const len = L.length || 1.2;\n  const n   = Math.max(5, Math.ceil(len / 0.08));\n  const rad = ((L.rotation || 0) * Math.PI) / 180;\n  const lm  = L.lumens / n;\n  return Array.from({ length: n }, (_, i) => {\n    const t = (i / (n - 1) - 0.5) * len; // -len/2 … +len/2\n    return { x: L.x + Math.cos(rad) * t, y: L.y + Math.sin(rad) * t, lm };\n  });\n}\n\nfunction computeNorm(beamAngle, distrib) {\n  const halfBeam = (beamAngle / 2) * Math.PI / 180;\n  const steps = 400;\n  let integral = 0;\n  for (let i = 0; i < steps; i++) {\n    const theta = halfBeam * (i + 0.5) / steps;\n    integral += intensityAtAngle(theta, beamAngle, distrib)\n                * 2 * Math.PI * Math.sin(theta)\n                * (halfBeam / steps);\n  }\n  return integral || 1e-9;\n}\n\nfunction distToSegmentPx(cx, cy, ax, ay, bx, by) {\n  const dx = bx-ax, dy = by-ay;\n  const len2 = dx*dx + dy*dy;\n  if (len2 === 0) return Math.hypot(cx-ax, cy-ay);\n  const t = Math.max(0, Math.min(1, ((cx-ax)*dx + (cy-ay)*dy) / len2));\n  return Math.hypot(cx - (ax+t*dx), cy - (ay+t*dy));\n}\n\nfunction drawMeasureLabel(ctx, x1, y1, x2, y2, wx1, wy1, wx2, wy2) {\n  const len = Math.hypot(wx2-wx1, wy2-wy1);\n  if (len < 0.05) return;\n  const angleDeg = Math.atan2(wy2-wy1, wx2-wx1) * 180 / Math.PI;\n  const label = `${len.toFixed(2)} m  ${((angleDeg % 360 + 360) % 360).toFixed(1)}°`;\n  const mx = (x1+x2)/2, my = (y1+y2)/2;\n  ctx.save();\n  ctx.font = '11px Segoe UI,sans-serif';\n  const tw = ctx.measureText(label).width;\n  ctx.fillStyle = 'rgba(0,0,0,0.72)';\n  ctx.beginPath(); ctx.roundRect(mx - tw/2 - 4, my - 13, tw + 8, 16, 3); ctx.fill();\n  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  ctx.fillText(label, mx, my - 5);\n  ctx.textBaseline = 'alphabetic';\n  ctx.restore();\n}\n\nfunction segmentsIntersect(ax, ay, bx, by, cx, cy, dx, dy) {\n  const d1x = bx-ax, d1y = by-ay, d2x = dx-cx, d2y = dy-cy;\n  const denom = d1x*d2y - d1y*d2x;\n  if (Math.abs(denom) < 1e-10) return false;\n  const t = ((cx-ax)*d2y - (cy-ay)*d2x) / denom;\n  const u = ((cx-ax)*d1y - (cy-ay)*d1x) / denom;\n  return t > 1e-6 && t < 1-1e-6 && u > 1e-6 && u < 1-1e-6;\n}\n\nfunction pointInPolygon(x, y, poly) {\n  let inside = false;\n  for (let i = 0, j = poly.length-1; i < poly.length; j = i++) {\n    const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;\n    if ((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside = !inside;\n  }\n  return inside;\n}\n\nfunction getOccluderWalls() {\n  const walls = [];\n  if (state.roomPolygon.length >= 3) {\n    for (let i = 0; i < state.roomPolygon.length; i++) {\n      const a = state.roomPolygon[i], b = state.roomPolygon[(i+1) % state.roomPolygon.length];\n      walls.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y });\n    }\n  }\n  for (const w of state.wallSegments) walls.push(w);\n  return walls;\n}\n\nfunction computeLuxGrid(rw, rd, resolution, lights, wPlane) {\n  const cols = Math.ceil(rw / resolution);\n  const rows = Math.ceil(rd / resolution);\n  const grid = new Float32Array(cols * rows);\n  const occluders = getOccluderWalls();\n\n  for (const L of lights) {\n    const dz = L.mountH - wPlane;\n    if (dz <= 0) continue;\n    const norm    = computeNorm(L.beamAngle, L.distrib);\n    const samples = getLightSamples(L);\n\n    const tiltRad = ((L.aimTilt || 0) * Math.PI) / 180;\n    const azRad   = ((L.aimAz   || 0) * Math.PI) / 180;\n    const bx    = Math.sin(tiltRad) * Math.cos(azRad);\n    const by    = Math.sin(tiltRad) * Math.sin(azRad);\n    const bCosZ = Math.cos(tiltRad);\n\n    for (const s of samples) {\n      const candela = (s.lm * L.llf) / norm;\n      for (let r = 0; r < rows; r++) {\n        const py = (r + 0.5) * resolution;\n        const dy = py - s.y;\n        for (let c = 0; c < cols; c++) {\n          const px = (c + 0.5) * resolution;\n          const dx = px - s.x;\n          if (occluders.length > 0) {\n            let blocked = false;\n            for (const w of occluders) {\n              if (segmentsIntersect(s.x, s.y, px, py, w.x1, w.y1, w.x2, w.y2)) { blocked = true; break; }\n            }\n            if (blocked) continue;\n          }\n          const d2     = dx*dx + dy*dy;\n          const d3sq   = d2 + dz*dz;\n          const d3     = Math.sqrt(d3sq);\n          const cosTheta = (bx*dx + by*dy + bCosZ*dz) / d3;\n          if (cosTheta <= 0) continue;\n          const theta = Math.acos(Math.min(1, cosTheta));\n          const I     = candela * intensityAtAngle(theta, L.beamAngle, L.distrib);\n          const E     = (I * (dz/d3)) / d3sq;\n          grid[r*cols+c] += Math.max(0, E);\n        }\n      }\n    }\n  }\n  return { grid, cols, rows };\n}\n\nfunction computeIndirectLux(lights, rw, rd, rh) {\n  let phiTotal = 0;\n  for (const L of lights) phiTotal += L.lumens * L.llf;\n\n  const rc = reflCeil(), rww = reflWalls(), rf = reflFloor();\n  const aFloor   = rw * rd;\n  const aCeiling = rw * rd;\n  const aWalls   = 2 * (rw + rd) * rh;\n  const aTotal   = aFloor + aCeiling + aWalls;\n  const rhoAvg   = (rc * aCeiling + rww * aWalls + rf * aFloor) / aTotal;\n  if (rhoAvg >= 1) return 0;\n  return (phiTotal * rhoAvg) / (aTotal * (1 - rhoAvg));\n}\n\nfunction applyReflPreset(ceil, walls, floor) {\n  recordHistory();\n  document.getElementById('reflCeil').value  = ceil;\n  document.getElementById('reflWalls').value = walls;\n  document.getElementById('reflFloor').value = floor;\n  scheduleAutoSave();\n}\n\nfunction clearRoomPolygon() {\n  recordHistory();\n  state.roomPolygon = [];\n  if (state.mode === 'draw-room') setMode('select');\n  invalidateSim(); refreshWallList(); draw(); scheduleAutoSave();\n}\n\nfunction closeRoomPolygon() {\n  if (state.roomPolygon.length >= 3) {\n    recordHistory();\n    setMode('select');\n    invalidateSim(); refreshWallList(); draw(); scheduleAutoSave();\n  }\n}\n\nfunction addWallSegment(x1, y1, x2, y2) {\n  recordHistory();\n  state.wallSegments.push({ id: state.nextWallId++, x1, y1, x2, y2 });\n  invalidateSim(); refreshWallList(); scheduleAutoSave();\n}\n\nfunction removeWall(id) {\n  recordHistory();\n  state.wallSegments = state.wallSegments.filter(w => w.id !== id);\n  invalidateSim(); refreshWallList(); draw(); scheduleAutoSave();\n}\n\nfunction refreshWallList() {\n  const el = document.getElementById('wall-list');\n  const pi = document.getElementById('poly-info');\n  const cp = document.getElementById('btn-close-poly');\n  if (!el) return;\n  const n = state.roomPolygon.length;\n  pi.textContent = n >= 3 ? `Polygon: ${n} vertices`\n    : n > 0 ? `Drawing… ${n} vertices (need ≥ 3)`\n    : 'No polygon — using rectangle';\n  cp.style.display = (state.mode === 'draw-room' && n >= 3) ? 'inline-block' : 'none';\n  el.innerHTML = state.wallSegments.length === 0\n    ? '<span style=\"color:var(--text-mut);\">No internal walls<\u002Fspan>'\n    : state.wallSegments.map(w =>\n        `<div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;\">\n          <span style=\"color:var(--text-sec);\">W${w.id} (${w.x1.toFixed(1)},${w.y1.toFixed(1)})→(${w.x2.toFixed(1)},${w.y2.toFixed(1)})<\u002Fspan>\n          <button onclick=\"removeWall(${w.id})\" style=\"background:none;border:none;color:var(--error);cursor:pointer;font-size:13px;padding:0 4px;\">✕<\u002Fbutton>\n        <\u002Fdiv>`\n      ).join('');\n}\n\nfunction downsampleGrid(grid, cols, rows, res, iCols, iRows, indRes) {\n  const out   = new Float64Array(iCols * iRows);\n  const count = new Uint16Array(iCols * iRows);\n  for (let r = 0; r < rows; r++) {\n    const ir = Math.min(iRows - 1, Math.floor(((r + 0.5) * res) / indRes));\n    for (let c = 0; c < cols; c++) {\n      const ic = Math.min(iCols - 1, Math.floor(((c + 0.5) * res) / indRes));\n      out[ir * iCols + ic] += grid[r * cols + c];\n      count[ir * iCols + ic]++;\n    }\n  }\n  for (let i = 0; i < out.length; i++) if (count[i]) out[i] /= count[i];\n  return out;\n}\n\nfunction lambertianTransfer(src, iCols, iRows, indRes, H, rho, walls) {\n  const dst     = new Float64Array(iCols * iRows);\n  const H2      = H * H;\n  const dA      = indRes * indRes;\n  const hasWalls = walls && walls.length > 0;\n  for (let ir = 0; ir < iRows; ir++) {\n    const cy = (ir + 0.5) * indRes;\n    for (let ic = 0; ic < iCols; ic++) {\n      const cx = (ic + 0.5) * indRes;\n      let E = 0;\n      for (let jr = 0; jr < iRows; jr++) {\n        const sy   = (jr + 0.5) * indRes;\n        const dy2  = (cy - sy) ** 2;\n        for (let jc = 0; jc < iCols; jc++) {\n          const v = src[jr * iCols + jc];\n          if (v <= 0) continue;\n          const sx = (jc + 0.5) * indRes;\n          if (hasWalls) {\n            let blocked = false;\n            for (const w of walls) {\n              if (segmentsIntersect(cx, cy, sx, sy, w.x1, w.y1, w.x2, w.y2)) { blocked = true; break; }\n            }\n            if (blocked) continue;\n          }\n          const dx2 = (cx - sx) ** 2;\n          const d2  = dx2 + dy2 + H2;\n          E += v * H2 / (Math.PI * d2 * d2) * dA;\n        }\n      }\n      dst[ir * iCols + ic] = E * rho;\n    }\n  }\n  return dst;\n}\n\nfunction upsampleGrid(coarse, iCols, iRows, indRes, cols, rows, res) {\n  const out = new Float32Array(cols * rows);\n  for (let r = 0; r < rows; r++) {\n    const fir = ((r + 0.5) * res) / indRes - 0.5;\n    const ir0 = Math.max(0, Math.floor(fir));\n    const ir1 = Math.min(iRows - 1, ir0 + 1);\n    const ty  = fir - ir0;\n    for (let c = 0; c < cols; c++) {\n      const fic = ((c + 0.5) * res) / indRes - 0.5;\n      const ic0 = Math.max(0, Math.floor(fic));\n      const ic1 = Math.min(iCols - 1, ic0 + 1);\n      const tx  = fic - ic0;\n      out[r * cols + c] =\n        (1-tx)*(1-ty) * coarse[ir0*iCols+ic0] +\n        tx*(1-ty)     * coarse[ir0*iCols+ic1] +\n        (1-tx)*ty     * coarse[ir1*iCols+ic0] +\n        tx*ty         * coarse[ir1*iCols+ic1];\n    }\n  }\n  return out;\n}\n\nfunction computeMultiBounce(directGrid, cols, rows, resolution, rw, rd, wPlane, rh, nBounces) {\n  const rc = reflCeil(), rww = reflWalls(), rf = reflFloor();\n  const H  = rh - wPlane;\n  if (H <= 0 || nBounces <= 0) return null;\n\n  const indRes = Math.max(0.4, Math.min(rw / 60, rd / 60, 2));\n  const iCols  = Math.ceil(rw / indRes);\n  const iRows  = Math.ceil(rd / indRes);\n\n  const totalCoarse = new Float64Array(iCols * iRows);\n  let curFloor = downsampleGrid(directGrid, cols, rows, resolution, iCols, iRows, indRes);\n  const occluders = getOccluderWalls();\n\n  const aFloor = rw * rd;\n  const aWalls = 2 * (rw + rd) * rh;\n\n  for (let b = 0; b < nBounces; b++) {\n    const ceilLux = lambertianTransfer(curFloor, iCols, iRows, indRes, H, rf, occluders);\n\n    let avgFloor = 0;\n    for (let i = 0; i < curFloor.length; i++) avgFloor += curFloor[i];\n    avgFloor /= curFloor.length;\n    const wallBoost = avgFloor * rf * rww * aWalls / (aFloor + aWalls);\n    for (let i = 0; i < ceilLux.length; i++) ceilLux[i] += wallBoost;\n\n    const newFloor = lambertianTransfer(ceilLux, iCols, iRows, indRes, H, rc, occluders);\n    for (let i = 0; i < totalCoarse.length; i++) totalCoarse[i] += newFloor[i];\n    curFloor = newFloor;\n  }\n\n  return upsampleGrid(totalCoarse, iCols, iRows, indRes, cols, rows, resolution);\n}\n\nfunction updateStatsPanel() {\n  const panel = document.getElementById('stats-panel');\n  if (!state.simulated) { panel.style.display = 'none'; return; }\n  panel.style.display = 'block';\n\n  const uni = state.avgLux > 0 ? state.minLux / state.avgLux : 0;\n  document.getElementById('stat-max').textContent = fmtLux(state.maxLux) + ' lx';\n  document.getElementById('stat-avg').textContent = fmtLux(state.avgLux) + ' lx';\n  document.getElementById('stat-min').textContent = fmtLux(state.minLux) + ' lx';\n\n  const uniEl = document.getElementById('stat-uni');\n  uniEl.textContent = uni.toFixed(2);\n  uniEl.className = uni >= 0.6 ? 'stat-ok' : uni >= 0.4 ? 'stat-val' : 'stat-bad';\n\n  const emergRow = document.getElementById('stat-emerg-row');\n  if (document.getElementById('showEmerg').checked && state.rawGrid) {\n    const threshold = parseFloat(document.getElementById('emergStd').value) || 1;\n    let pass = 0;\n    for (let i = 0; i < state.rawGrid.length; i++) if (state.rawGrid[i] >= threshold) pass++;\n    const pct = (pass / state.rawGrid.length * 100).toFixed(1);\n    document.getElementById('stat-emerg-label').textContent = `≥ ${threshold} lx compliant`;\n    const emergEl = document.getElementById('stat-emerg');\n    emergEl.textContent = pct + '%';\n    emergEl.className = pct >= 95 ? 'stat-ok' : pct >= 80 ? 'stat-val' : 'stat-bad';\n    emergRow.style.display = '';\n  } else {\n    emergRow.style.display = 'none';\n  }\n}\n\nfunction parseContourLevels() {\n  return document.getElementById('contourLevels').value\n    .split(',').map(s => parseFloat(s.trim())).filter(v => !isNaN(v) && v > 0).sort((a,b) => a-b);\n}\n\nfunction renderContours(canvasCtx, coordFn, dotR) {\n  if (!state.rawGrid || !state.heatmap) return;\n  if (!document.getElementById('showContours').checked) return;\n  const grid = state.rawGrid;\n  const { cols, rows, resolution } = state.heatmap;\n  const levels = parseContourLevels();\n  if (!levels.length) return;\n  const sMax = scaleMax();\n  const r = dotR || 1.5;\n\n  for (const level of levels) {\n    const [R, G, B] = luxToColor(level / sMax, 1);\n    canvasCtx.fillStyle = `rgb(${R},${G},${B})`;\n\n    // dots on horizontal edges\n    for (let row = 0; row < rows - 1; row++) {\n      for (let col = 0; col < cols; col++) {\n        const v0 = grid[row * cols + col];\n        const v1 = grid[(row + 1) * cols + col];\n        if ((v0 < level) !== (v1 < level)) {\n          const t = (level - v0) / (v1 - v0);\n          const [px, py] = coordFn((col + 0.5) * resolution, (row + t) * resolution);\n          canvasCtx.beginPath(); canvasCtx.arc(px, py, r, 0, Math.PI * 2); canvasCtx.fill();\n        }\n      }\n    }\n    // dots on vertical edges\n    for (let row = 0; row < rows; row++) {\n      for (let col = 0; col < cols - 1; col++) {\n        const v0 = grid[row * cols + col];\n        const v1 = grid[row * cols + col + 1];\n        if ((v0 < level) !== (v1 < level)) {\n          const t = (level - v0) / (v1 - v0);\n          const [px, py] = coordFn((col + t) * resolution, (row + 0.5) * resolution);\n          canvasCtx.beginPath(); canvasCtx.arc(px, py, r, 0, Math.PI * 2); canvasCtx.fill();\n        }\n      }\n    }\n\n    let labeled = false;\n    outer: for (let row = 0; row < rows - 1; row++) {\n      for (let col = 1; col < cols - 1; col++) {\n        const v0 = grid[row * cols + col];\n        const v1 = grid[(row + 1) * cols + col];\n        if ((v0 < level) !== (v1 < level)) {\n          const t = (level - v0) / (v1 - v0);\n          const [px, py] = coordFn((col + 0.5) * resolution, (row + t) * resolution);\n          const label = fmtLux(level) + ' lx';\n          const fontSize = r > 2 ? 18 : 10;\n          canvasCtx.save();\n          canvasCtx.font = `bold ${fontSize}px Segoe UI,sans-serif`;\n          const tw = canvasCtx.measureText(label).width;\n          canvasCtx.fillStyle = 'rgba(0,0,0,0.65)';\n          canvasCtx.fillRect(px + r + 3, py - fontSize, tw + 6, fontSize + 4);\n          canvasCtx.fillStyle = `rgb(${R},${G},${B})`;\n          canvasCtx.textAlign = 'left';\n          canvasCtx.fillText(label, px + r + 5, py);\n          canvasCtx.restore();\n          labeled = true;\n          break outer;\n        }\n      }\n    }\n  }\n}\n\nfunction drawContours() { renderContours(ctx, w2c, 1.5); }\n\nfunction renderTargetOverlay(canvasCtx, coordFn) {\n  if (!state.rawGrid || !state.heatmap) return;\n  if (!document.getElementById('showTarget').checked) return;\n  const target = parseFloat(document.getElementById('targetLux').value) || 300;\n  const grid = state.rawGrid;\n  const { cols, rows, resolution } = state.heatmap;\n  canvasCtx.save();\n  canvasCtx.fillStyle = 'rgba(220,30,30,0.35)';\n  for (let row = 0; row < rows; row++) {\n    for (let col = 0; col < cols; col++) {\n      if (grid[row * cols + col] < target) {\n        const [px,  py]  = coordFn(col * resolution,       row * resolution);\n        const [px2, py2] = coordFn((col + 1) * resolution, (row + 1) * resolution);\n        canvasCtx.fillRect(px, py, Math.max(1, px2 - px), Math.max(1, py2 - py));\n      }\n    }\n  }\n  canvasCtx.restore();\n}\n\nfunction drawTargetOverlay() { renderTargetOverlay(ctx, w2c); }\n\nfunction renderEmergencyOverlay(canvasCtx, coordFn) {\n  if (!state.rawGrid || !state.heatmap) return;\n  if (!document.getElementById('showEmerg').checked) return;\n  const threshold = parseFloat(document.getElementById('emergStd').value) || 1;\n  const grid = state.rawGrid;\n  const { cols, rows, resolution } = state.heatmap;\n  canvasCtx.save();\n  for (let row = 0; row < rows; row++) {\n    for (let col = 0; col < cols; col++) {\n      const lux = grid[row * cols + col];\n      if (lux < 0) continue;\n      canvasCtx.fillStyle = lux >= threshold ? 'rgba(0,200,80,0.28)' : 'rgba(220,30,30,0.40)';\n      const [px,  py]  = coordFn(col * resolution,       row * resolution);\n      const [px2, py2] = coordFn((col + 1) * resolution, (row + 1) * resolution);\n      canvasCtx.fillRect(px, py, Math.max(1, px2 - px), Math.max(1, py2 - py));\n    }\n  }\n  canvasCtx.restore();\n}\n\nfunction drawEmergencyOverlay() { renderEmergencyOverlay(ctx, w2c); }\n\nfunction drawRuler() {\n  if (!state.ruler) return;\n  const { x1, y1, x2, y2 } = state.ruler;\n  const [cx1, cy1] = w2c(x1, y1);\n  const [cx2, cy2] = w2c(x2, y2);\n  const dist = Math.hypot(x2 - x1, y2 - y1);\n\n  ctx.save();\n  ctx.strokeStyle = '#fff';\n  ctx.lineWidth = 1.5;\n  ctx.setLineDash([5, 3]);\n  ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.stroke();\n  ctx.setLineDash([]);\n\n  const angle = Math.atan2(cy2 - cy1, cx2 - cx1);\n  const perpA = angle + Math.PI / 2;\n  for (const [cx, cy] of [[cx1, cy1], [cx2, cy2]]) {\n    ctx.beginPath();\n    ctx.moveTo(cx + Math.cos(perpA) * 6, cy + Math.sin(perpA) * 6);\n    ctx.lineTo(cx - Math.cos(perpA) * 6, cy - Math.sin(perpA) * 6);\n    ctx.stroke();\n  }\n\n  const mx = (cx1 + cx2) / 2, my = (cy1 + cy2) / 2;\n  const label = dist < 1 ? (dist * 100).toFixed(0) + ' cm' : dist.toFixed(2) + ' m';\n  ctx.font = 'bold 12px Segoe UI,sans-serif';\n  const tw = ctx.measureText(label).width;\n  ctx.fillStyle = 'rgba(0,0,0,0.75)';\n  ctx.beginPath(); ctx.roundRect(mx - tw/2 - 5, my - 11, tw + 10, 16, 3); ctx.fill();\n  ctx.fillStyle = '#fff';\n  ctx.textAlign = 'center';\n  ctx.fillText(label, mx, my);\n  ctx.restore();\n}\n\nfunction gridLux(wx, wy) {\n  if (!state.rawGrid || !state.heatmap) return null;\n  const hm  = state.heatmap;\n  const col = Math.floor(wx / hm.resolution);\n  const row = Math.floor(wy / hm.resolution);\n  if (col < 0 || col >= hm.cols || row < 0 || row >= hm.rows) return null;\n  const v = state.rawGrid[row * hm.cols + col];\n  return v < 0 ? null : v;\n}\n\nfunction scaleMax() {\n  const v = document.getElementById('luxScale').value;\n  if (v === 'auto')   return state.maxLux || 1;\n  if (v === 'custom') return parseFloat(document.getElementById('customLuxMax').value) || 500;\n  return parseFloat(v);\n}\n\nfunction simulate() {\n  const effectiveLights = getEffectiveLights(state.activeScenarioId);\n  if (effectiveLights.length === 0 && state.windows.length === 0) { alert('Place at least one light or window first.'); return; }\n  const rw = roomW(), rd = roomD(), wPlane = workPlane();\n\n  let gridW = rw, gridD = rd;\n  if (state.roomPolygon.length >= 3) {\n    gridW = Math.max(rw, Math.max(...state.roomPolygon.map(p => p.x)) + 1);\n    gridD = Math.max(rd, Math.max(...state.roomPolygon.map(p => p.y)) + 1);\n  }\n\n  const resolution = Math.max(0.04, Math.min(gridW, gridD) / 450);\n  const { grid, cols, rows } = computeLuxGrid(gridW, gridD, resolution, effectiveLights, wPlane);\n\n  if (!state.openArea) {\n    const nBounces = parseInt(document.getElementById('reflBounces').value) || 3;\n    const indirect = computeMultiBounce(grid, cols, rows, resolution, gridW, gridD, wPlane, roomH(), nBounces);\n    if (indirect) {\n      for (let i = 0; i < grid.length; i++) grid[i] += indirect[i];\n    }\n  }\n\n  if (state.windows.length > 0) {\n    const winGrid = computeWindowsLux(state.windows, state.sunConfig, gridW, gridD, wPlane, cols, rows, resolution);\n    if (!state.openArea) {\n      const nBounces = parseInt(document.getElementById('reflBounces').value) || 3;\n      const winBounce = computeMultiBounce(winGrid, cols, rows, resolution, gridW, gridD, wPlane, roomH(), nBounces);\n      if (winBounce) for (let i = 0; i < grid.length; i++) { if (grid[i] >= 0) grid[i] += winBounce[i]; }\n    }\n    for (let i = 0; i < grid.length; i++) { if (grid[i] >= 0) grid[i] += winGrid[i]; }\n  }\n\n  if (state.roomPolygon.length >= 3) {\n    for (let r = 0; r < rows; r++) {\n      for (let c = 0; c < cols; c++) {\n        if (!pointInPolygon((c+0.5)*resolution, (r+0.5)*resolution, state.roomPolygon))\n          grid[r*cols+c] = -1;\n      }\n    }\n  }\n\n  let maxLux = 0, minLux = Infinity, sumLux = 0, countLux = 0;\n  for (let i = 0; i < grid.length; i++) {\n    if (grid[i] < 0) continue;\n    maxLux = Math.max(maxLux, grid[i]);\n    minLux = Math.min(minLux, grid[i]);\n    sumLux += grid[i];\n    countLux++;\n  }\n  const avgLux = countLux > 0 ? sumLux / countLux : 0;\n  state.maxLux  = maxLux;\n  state.minLux  = minLux === Infinity ? 0 : minLux;\n  state.avgLux  = avgLux;\n  state.rawGrid = grid;\n  state.heatmap = { imgData: null, cols, rows, rw: gridW, rd: gridD, resolution };\n  state.simulated = true;\n  state.simResults['active'] = { rawGrid: grid, heatmap: state.heatmap, maxLux, minLux: state.minLux, avgLux };\n  updateStatsPanel();\n\n  for (const p of state.pins) {\n    const lux = gridLux(p.x, p.y);\n    if (lux !== null) p.lux = lux;\n  }\n\n  document.getElementById('btn-pin-mode').disabled = false;\n  document.getElementById('tool-pin').disabled     = false;\n  refreshPinList();\n  renderHeatmap(); // colours + legend + draw\n}\n\nfunction renderHeatmap() {\n  if (!state.rawGrid || !state.heatmap) return;\n  const { cols, rows } = state.heatmap;\n  const sMax   = scaleMax();\n  const imgData = new ImageData(cols, rows);\n  for (let r = 0; r < rows; r++) {\n    for (let c = 0; c < cols; c++) {\n      const lux = state.rawGrid[r*cols+c];\n      const idx = (r*cols+c)*4;\n      if (lux < 0) { imgData.data[idx+3] = 0; continue; }\n      const [R,G,B] = luxToColor(lux, sMax);\n      imgData.data[idx]=R; imgData.data[idx+1]=G; imgData.data[idx+2]=B; imgData.data[idx+3]=210;\n    }\n  }\n  state.heatmap.imgData = imgData;\n  updateLegendBar();\n  draw();\n}\n\nfunction fmtLux(v) { return v < 10 ? v.toFixed(1) : v < 100 ? v.toFixed(0) : Math.round(v).toString(); }\n\nfunction updateLegendBar() {\n  const sMax = scaleMax();\n  const lc   = document.getElementById('legend-bar');\n  const lct  = lc.getContext('2d');\n  const grd  = lct.createLinearGradient(0, 0, 160, 0);\n  [0,0.12,0.30,0.50,0.70,0.88,1.0].forEach(t => {\n    const [R,G,B] = luxToColor(t, 1);\n    grd.addColorStop(t, `rgb(${R},${G},${B})`);\n  });\n  lct.fillStyle = grd;\n  lct.fillRect(0, 0, 160, 14);\n\n  document.getElementById('lux-q1').textContent  = fmtLux(sMax * 0.25);\n  document.getElementById('lux-mid').textContent = fmtLux(sMax * 0.50);\n  document.getElementById('lux-q3').textContent  = fmtLux(sMax * 0.75);\n  document.getElementById('lux-max').textContent = fmtLux(sMax);\n}\n\nfunction draw() {\n  if (state.compareMode) { drawCompareSplit(); return; }\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0,0,W,H);\n  ctx.fillStyle = '#050805';\n  ctx.fillRect(0,0,W,H);\n\n  const rw = roomW(), rd = roomD();\n  const [x0,y0] = w2c(0,0);\n  const [x1,y1] = w2c(rw,rd);\n\n  if (state.bgImage) {\n    const opacity   = (parseFloat(document.getElementById('bgOpacity').value) || 30) / 100;\n    const bgS       = (parseFloat(document.getElementById('bgScale').value)  || 100) / 100;\n    const bgX       = parseFloat(document.getElementById('bgOffX').value) || 0;\n    const bgY       = parseFloat(document.getElementById('bgOffY').value) || 0;\n    const imgWorldW = roomW() * bgS;\n    const imgWorldH = imgWorldW * (state.bgImage.naturalHeight / state.bgImage.naturalWidth);\n    const [ibx, iby] = w2c(bgX, bgY);\n    ctx.save();\n    ctx.beginPath();\n    ctx.rect(x0, y0, x1 - x0, y1 - y0);\n    ctx.clip();\n    ctx.globalAlpha = opacity;\n    ctx.drawImage(state.bgImage, ibx, iby, imgWorldW * state.zoom, imgWorldH * state.zoom);\n    ctx.restore();\n  }\n\n  if (state.heatmap) {\n    const hm  = state.heatmap;\n    const off = document.createElement('canvas');\n    off.width  = hm.cols; off.height = hm.rows;\n    off.getContext('2d').putImageData(hm.imgData, 0, 0);\n    ctx.imageSmoothingEnabled  = true;\n    ctx.imageSmoothingQuality  = 'high';\n    const [hx0, hy0] = w2c(0, 0);\n    const [hx1, hy1] = w2c(hm.rw, hm.rd);\n    ctx.drawImage(off, hx0, hy0, hx1-hx0, hy1-hy0);\n  }\n\n  drawTargetOverlay();\n  drawEmergencyOverlay();\n\n  if (state.roomPolygon.length === 0 && state.mode !== 'draw-room') {\n    if (!state.openArea) {\n      ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2; ctx.setLineDash([]);\n    } else {\n      ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.setLineDash([6,4]);\n    }\n    ctx.strokeRect(x0, y0, x1-x0, y1-y0);\n    ctx.setLineDash([]);\n  }\n\n  ctx.strokeStyle = 'rgba(255,255,255,0.045)'; ctx.lineWidth = 0.5;\n  const gs = gridStep();\n  for (let gx = 0; gx <= rw+.001; gx += gs) { const [cx] = w2c(gx,0); ctx.beginPath(); ctx.moveTo(cx,y0); ctx.lineTo(cx,y1); ctx.stroke(); }\n  for (let gy = 0; gy <= rd+.001; gy += gs) { const [,cy] = w2c(0,gy); ctx.beginPath(); ctx.moveTo(x0,cy); ctx.lineTo(x1,cy); ctx.stroke(); }\n\n  ctx.fillStyle='rgba(255,255,255,0.42)'; ctx.font='11px Segoe UI,sans-serif'; ctx.textAlign='center';\n  ctx.fillText(rw.toFixed(1)+' m', (x0+x1)/2, y1+18);\n  ctx.save(); ctx.translate(x0-20,(y0+y1)/2); ctx.rotate(-Math.PI/2);\n  ctx.fillText(rd.toFixed(1)+' m', 0, 0); ctx.restore();\n\n  for (const L of state.lights) {\n    const [lx,ly] = w2c(L.x, L.y);\n    const isSel   = L.id === state.selectedLightId;\n    const tint    = cctTint(L.cct);\n    const tr      = t => Math.round(t*255);\n    const tc      = `rgb(${tr(tint[0])},${tr(tint[1])},${tr(tint[2])})`;\n\n    if (L.shape === 'linear') {\n      const len = L.length || 1.2;\n      const rad = ((L.rotation || 0) * Math.PI) / 180;\n      const [sx,sy] = w2c(L.x - Math.cos(rad)*len/2, L.y - Math.sin(rad)*len/2);\n      const [ex,ey] = w2c(L.x + Math.cos(rad)*len/2, L.y + Math.sin(rad)*len/2);\n\n      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey);\n      ctx.strokeStyle = tc;\n      ctx.lineWidth   = isSel ? 5 : 3;\n      ctx.lineCap     = 'round';\n      ctx.stroke();\n      ctx.lineCap = 'butt';\n      if (isSel) {\n        ctx.beginPath(); ctx.arc(lx,ly,7,0,Math.PI*2);\n        ctx.strokeStyle='#f5a623'; ctx.lineWidth=2; ctx.stroke();\n      }\n      // label\n      ctx.fillStyle = isSel ? '#f5a623' : '#aaa';\n      ctx.font = '10px Segoe UI,sans-serif'; ctx.textAlign='left';\n      ctx.fillText(`L${L.id}`, lx+10, ly+4);\n\n    } else {\n      ctx.beginPath(); ctx.arc(lx,ly,isSel?9:6,0,Math.PI*2);\n      ctx.fillStyle = tc; ctx.fill();\n      if (isSel) { ctx.strokeStyle='#f5a623'; ctx.lineWidth=2; ctx.stroke(); }\n\n      ctx.fillStyle = isSel ? '#f5a623' : '#aaa';\n      ctx.font = '10px Segoe UI,sans-serif'; ctx.textAlign='left';\n      ctx.fillText(`L${L.id}`, lx+10, ly+4);\n    }\n\n    if ((L.aimTilt || 0) > 0) {\n      const azRad = ((L.aimAz || 0) * Math.PI) / 180;\n      const arrowLen = 18 + (L.aimTilt / 90) * 18;\n      const ax = lx + Math.cos(azRad) * arrowLen;\n      const ay = ly + Math.sin(azRad) * arrowLen;\n      ctx.save();\n      ctx.strokeStyle = isSel ? '#f5a623' : 'rgba(255,255,255,0.7)';\n      ctx.lineWidth = 2;\n      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(ax, ay); ctx.stroke();\n      const hAngle = Math.atan2(ay - ly, ax - lx);\n      ctx.beginPath();\n      ctx.moveTo(ax, ay);\n      ctx.lineTo(ax - 7*Math.cos(hAngle-0.4), ay - 7*Math.sin(hAngle-0.4));\n      ctx.lineTo(ax - 7*Math.cos(hAngle+0.4), ay - 7*Math.sin(hAngle+0.4));\n      ctx.closePath();\n      ctx.fillStyle = isSel ? '#f5a623' : 'rgba(255,255,255,0.7)';\n      ctx.fill();\n      ctx.restore();\n    }\n  }\n\n  drawWindows();\n  if (document.getElementById('showContours').checked) drawContours();\n\n  for (const p of state.pins) {\n    const [px,py] = w2c(p.x, p.y);\n    const isSel   = p.id === state.selectedPinId;\n    drawPin(ctx, px, py, p.id, p.lux, isSel);\n  }\n\n  drawRuler();\n\n  if (state.mode === 'array' && state.arrayPreview) {\n    ctx.save();\n    ctx.strokeStyle = 'rgba(245,166,35,0.7)';\n    ctx.fillStyle   = 'rgba(245,166,35,0.25)';\n    ctx.lineWidth = 1;\n    for (const [wx, wy] of state.arrayPreview) {\n      const [px, py] = w2c(wx, wy);\n      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2);\n      ctx.fill(); ctx.stroke();\n    }\n    ctx.restore();\n  }\n\n  if (state.roomPolygon.length > 0) {\n    ctx.save();\n    ctx.strokeStyle = '#4af';\n    ctx.lineWidth = 2;\n    ctx.setLineDash([]);\n    const [p0x, p0y] = w2c(state.roomPolygon[0].x, state.roomPolygon[0].y);\n    ctx.beginPath(); ctx.moveTo(p0x, p0y);\n    for (let i = 1; i < state.roomPolygon.length; i++) {\n      const [vx, vy] = w2c(state.roomPolygon[i].x, state.roomPolygon[i].y);\n      ctx.lineTo(vx, vy);\n    }\n    if (state.mode !== 'draw-room') ctx.closePath();\n    ctx.stroke();\n    if (state.mode === 'draw-room') {\n      for (let i = 1; i < state.roomPolygon.length; i++) {\n        const [ax, ay] = w2c(state.roomPolygon[i-1].x, state.roomPolygon[i-1].y);\n        const [bx, by] = w2c(state.roomPolygon[i].x,   state.roomPolygon[i].y);\n        drawMeasureLabel(ctx, ax, ay, bx, by, state.roomPolygon[i-1].x, state.roomPolygon[i-1].y, state.roomPolygon[i].x, state.roomPolygon[i].y);\n      }\n      const last = state.roomPolygon[state.roomPolygon.length - 1];\n      const [lx2, ly2] = w2c(last.x, last.y);\n      const [mx, my] = w2c(state.mouseWorld.x, state.mouseWorld.y);\n      ctx.setLineDash([4, 4]);\n      ctx.beginPath(); ctx.moveTo(lx2, ly2); ctx.lineTo(mx, my); ctx.stroke();\n      ctx.setLineDash([]);\n      drawMeasureLabel(ctx, lx2, ly2, mx, my, last.x, last.y, state.mouseWorld.x, state.mouseWorld.y);\n      if (state.roomPolygon.length >= 3) {\n        ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2;\n        ctx.beginPath(); ctx.arc(p0x, p0y, 9, 0, Math.PI*2); ctx.stroke();\n      }\n    }\n    if (state.mode === 'edit-room') {\n      for (let i = 0; i < state.roomPolygon.length; i++) {\n        const v = state.roomPolygon[i];\n        const [vx, vy] = w2c(v.x, v.y);\n        const isDrag = state.draggingVertex !== null && state.draggingVertex.index === i;\n        const isHov  = state.hoveredVertex === i;\n        ctx.fillStyle   = isDrag ? '#fff' : isHov ? '#ffe' : '#fa0';\n        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;\n        const r = isDrag || isHov ? 9 : 7;\n        ctx.beginPath(); ctx.arc(vx, vy, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();\n      }\n    } else {\n      ctx.fillStyle = '#4af';\n      for (const v of state.roomPolygon) {\n        const [vx, vy] = w2c(v.x, v.y);\n        ctx.beginPath(); ctx.arc(vx, vy, 4, 0, Math.PI*2); ctx.fill();\n      }\n    }\n    ctx.restore();\n  }\n\n  for (const w of state.wallSegments) {\n    const [wx1, wy1] = w2c(w.x1, w.y1);\n    const [wx2, wy2] = w2c(w.x2, w.y2);\n    const isSel = w.id === state.selectedWallId;\n    ctx.save();\n    ctx.strokeStyle = isSel ? '#ff0' : '#f84';\n    ctx.lineWidth = isSel ? 4 : 3;\n    ctx.lineCap = 'round';\n    ctx.beginPath(); ctx.moveTo(wx1, wy1); ctx.lineTo(wx2, wy2); ctx.stroke();\n    ctx.lineCap = 'butt';\n    if (isSel) drawMeasureLabel(ctx, wx1, wy1, wx2, wy2, w.x1, w.y1, w.x2, w.y2);\n    ctx.restore();\n  }\n\n  if (state.mode === 'draw-wall' && state.drawingWall) {\n    const [sx, sy] = w2c(state.drawingWall.x, state.drawingWall.y);\n    const [mx, my] = w2c(state.mouseWorld.x, state.mouseWorld.y);\n    ctx.save();\n    ctx.strokeStyle = 'rgba(255,136,68,0.7)'; ctx.lineWidth = 2;\n    ctx.setLineDash([4, 4]); ctx.lineCap = 'round';\n    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(mx, my); ctx.stroke();\n    ctx.setLineDash([]); ctx.lineCap = 'butt';\n    ctx.fillStyle = '#f84';\n    ctx.beginPath(); ctx.arc(sx, sy, 5, 0, Math.PI*2); ctx.fill();\n    drawMeasureLabel(ctx, sx, sy, mx, my, state.drawingWall.x, state.drawingWall.y, state.mouseWorld.x, state.mouseWorld.y);\n    ctx.restore();\n  }\n}\n\nfunction drawPin(c, px, py, id, lux, selected) {\n  const r = selected ? 10 : 8;\n  c.beginPath();\n  c.arc(px, py - r, r, 0, Math.PI*2);\n  c.fillStyle = selected ? '#f5a623' : '#e74c3c';\n  c.fill();\n  c.beginPath();\n  c.moveTo(px - r*0.55, py - r);\n  c.lineTo(px, py + 2);\n  c.lineTo(px + r*0.55, py - r);\n  c.fillStyle = selected ? '#f5a623' : '#e74c3c';\n  c.fill();\n  c.fillStyle = '#fff';\n  c.font = `bold ${r-1}px Segoe UI,sans-serif`;\n  c.textAlign = 'center';\n  c.fillText(`${id}`, px, py - r + (r-1)*0.38);\n  if (lux !== null && lux !== undefined) {\n    const txt  = `${fmtLux(lux)} lx`;\n    c.font     = '10px Segoe UI,sans-serif';\n    const tw   = c.measureText(txt).width;\n    const bx   = px + r + 3;\n    const by   = py - r * 2 - 4;\n    c.fillStyle = 'rgba(0,0,0,0.75)';\n    c.beginPath();\n    c.roundRect(bx - 3, by - 11, tw + 8, 15, 3);\n    c.fill();\n    c.fillStyle = selected ? '#f5a623' : '#eee';\n    c.textAlign = 'left';\n    c.fillText(txt, bx + 1, by);\n  }\n}\n\nfunction gridStep() {\n  const steps = [0.1,0.25,0.5,1,2,5,10,20,50,100,200];\n  return steps.find(s => s * state.zoom >= 40) || 200;\n}\n\nconst specFields = ['lumens','beamAngle','mountH','cct','llf','distrib','shape','lightLength','lightRotation','aimTilt','aimAz'];\n\nfunction readSpec() {\n  return {\n    shape:    document.getElementById('shape').value,\n    length:   parseFloat(document.getElementById('lightLength').value)   || 1.2,\n    rotation: parseFloat(document.getElementById('lightRotation').value) || 0,\n    lumens:    parseFloat(document.getElementById('lumens').value)    || 3000,\n    beamAngle: parseFloat(document.getElementById('beamAngle').value) || 120,\n    mountH:    parseFloat(document.getElementById('mountH').value)    || 3.0,\n    cct:       parseFloat(document.getElementById('cct').value)       || 4000,\n    llf:       parseFloat(document.getElementById('llf').value)       || 0.8,\n    distrib:   document.getElementById('distrib').value,\n    aimTilt:   parseFloat(document.getElementById('aimTilt').value)   || 0,\n    aimAz:     parseFloat(document.getElementById('aimAz').value)     || 0,\n  };\n}\n\nfunction loadSpec(L) {\n  if (!L) {\n    document.getElementById('spec-editing').textContent = '';\n    return;\n  }\n  document.getElementById('spec-editing').textContent = `— L${L.id}`;\n  document.getElementById('shape').value         = L.shape    || 'point';\n  document.getElementById('lightLength').value   = L.length   || 1.2;\n  document.getElementById('lightRotation').value = L.rotation || 0;\n  document.getElementById('lumens').value    = L.lumens;\n  document.getElementById('beamAngle').value = L.beamAngle;\n  document.getElementById('mountH').value    = L.mountH;\n  document.getElementById('cct').value       = L.cct;\n  document.getElementById('llf').value       = L.llf;\n  document.getElementById('distrib').value   = L.distrib;\n  document.getElementById('aimTilt').value   = L.aimTilt || 0;\n  document.getElementById('aimAz').value     = L.aimAz   || 0;\n  const isLinear = (L.shape || 'point') === 'linear';\n  document.getElementById('linear-opts').classList.toggle('hidden', !isLinear);\n  document.getElementById('aim-az-row').style.display = isLinear ? 'none' : '';\n}\n\nspecFields.forEach(id => {\n  document.getElementById(id).addEventListener('change', () => {\n    if (id === 'shape') {\n      const isLinear = document.getElementById('shape').value === 'linear';\n      document.getElementById('linear-opts').classList.toggle('hidden', !isLinear);\n      document.getElementById('aim-az-row').style.display = isLinear ? 'none' : '';\n    }\n    const L = state.lights.find(l => l.id === state.selectedLightId);\n    if (!L) return;\n    recordHistory();\n    Object.assign(L, readSpec());\n    state.heatmap   = null;\n    state.rawGrid   = null;\n    state.simulated = false;\n    document.getElementById('btn-pin-mode').disabled = true;\n    document.getElementById('tool-pin').disabled     = true;\n    refreshLightList();\n    draw();\n    scheduleAutoSave();\n  });\n});\n\nlet GRID_SNAP = 0.25;\nfunction snap(v) { return Math.round(v / GRID_SNAP) * GRID_SNAP; }\n\nfunction renumberLights() {\n  const sel = state.lights.find(l => l.id === state.selectedLightId);\n  state.lights.forEach((L, i) => { L.id = i + 1; });\n  state.nextLightId = state.lights.length + 1;\n  if (sel) {\n    state.selectedLightId = sel.id; // id was updated in place above\n    document.getElementById('spec-editing').textContent = `— L${sel.id}`;\n  } else {\n    state.selectedLightId = null;\n    document.getElementById('spec-editing').textContent = '';\n  }\n}\n\nfunction renumberPins() {\n  const sel = state.pins.find(p => p.id === state.selectedPinId);\n  state.pins.forEach((p, i) => { p.id = i + 1; });\n  state.nextPinId = state.pins.length + 1;\n  state.selectedPinId = sel ? sel.id : null;\n}\n\nfunction buildArrayPositions(cx, cy) {\n  const rows  = parseInt(document.getElementById('arrRows').value) || 2;\n  const cols  = parseInt(document.getElementById('arrCols').value) || 3;\n  const spX   = parseFloat(document.getElementById('arrSpX').value) || 2.5;\n  const spY   = parseFloat(document.getElementById('arrSpY').value) || 2.5;\n  const positions = [];\n  const offX = (cols - 1) * spX / 2;\n  const offY = (rows - 1) * spY / 2;\n  for (let r = 0; r < rows; r++)\n    for (let c = 0; c < cols; c++)\n      positions.push([cx + c * spX - offX, cy + r * spY - offY]);\n  return positions;\n}\n\nfunction addLight(wx, wy) {\n  recordHistory();\n  const L = { id: state.nextLightId++, x: snap(wx), y: snap(wy), ...readSpec() };\n  state.lights.push(L);\n  selectLight(L.id);\n  invalidateSim();\n  scheduleAutoSave();\n}\n\nfunction removeLight(id) {\n  recordHistory();\n  state.lights = state.lights.filter(l => l.id !== id);\n  renumberLights();\n  invalidateSim();\n  refreshLightList();\n  draw();\n  scheduleAutoSave();\n}\n\nfunction selectLight(id) {\n  state.selectedLightId = id;\n  state.selectedPinId   = null;\n  const L = state.lights.find(l => l.id === id);\n  loadSpec(L);\n  refreshLightList();\n  refreshPinList();\n  draw();\n}\n\nfunction refreshLightList() {\n  const ul = document.getElementById('light-li
