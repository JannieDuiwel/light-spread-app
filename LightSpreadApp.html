entById('open-dims').classList.toggle('hidden', !open);\n  document.getElementById('room-h-label').classList.toggle('hidden', open);\n  document.getElementById('reflectance-section').classList.toggle('hidden', open);\n  invalidateSim(); fitView(); draw();\n});\n\ndocument.getElementById('luxScale').addEventListener('change', () => {\n  const isCustom = document.getElementById('luxScale').value === 'custom';\n  document.getElementById('custom-lux-row').classList.toggle('hidden', !isCustom);\n  if (state.simulated) renderHeatmap();\n  else updateLegendBar();\n});\n\ndocument.getElementById('customLuxMax').addEventListener('change', () => {\n  if (state.simulated) renderHeatmap();\n  else updateLegendBar();\n});\n\n['roomW','roomD','areaW','areaD'].forEach(id => {\n  document.getElementById(id).addEventListener('change', () => { recordHistory(); invalidateSim(); fitView(); draw(); scheduleAutoSave(); });\n});\n\ndocument.addEventListener('keydown', e => {\n  const active = document.activeElement;\n  const typing = active && (active.tagName === 'INPUT' || active.tagName === 'SELECT' || active.tagName === 'TEXTAREA');\n\n  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }\n  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }\n\n  if (e.key === 'Escape') {\n    if (state.mode === 'draw-room' && state.roomPolygon.length > 0) {\n      state.roomPolygon.pop(); refreshWallList(); draw();\n    } else {\n      setMode('select'); document.getElementById('array-panel').style.display = 'none';\n    }\n  }\n  if (!typing) {\n    if (e.key === 'p' || e.key === 'P') setMode('place');\n    if (e.key === 'm' || e.key === 'M') setMode('pin');\n    if (e.key === 'Enter') simulate();\n    if (e.key === 'Delete' || e.key === 'Backspace') {\n      if (state.selectedWallId  !== null) removeWall(state.selectedWallId);\n      else if (state.selectedLightId !== null) removeLight(state.selectedLightId);\n      else if (state.selectedPinId   !== null) removePin(state.selectedPinId);\n    }\n  }\n});\n\ndocument.getElementById('btn-export').addEventListener('click', exportPNG);\n\nfunction exportPNG() {\n  if (!state.simulated) { alert('Run a simulation first.'); return; }\n\n  const PW = 2480, PH = 1754;\n  const oc  = document.createElement('canvas');\n  oc.width  = PW; oc.height = PH;\n  const c   = oc.getContext('2d');\n\n  const bg = '#ffffff', dark = '#1a1a1a', accent = '#f5a623', red = '#e74c3c';\n\n  c.fillStyle = bg; c.fillRect(0,0,PW,PH);\n\n  c.fillStyle = dark; c.fillRect(0, 0, PW, 110);\n  c.fillStyle = '#fff';\n  c.font = 'bold 46px Segoe UI, sans-serif';\n  c.textAlign = 'left';\n  c.fillText(document.getElementById('projectTitle').value || 'Light Simulation Report', 50, 62);\n  c.font = '22px Segoe UI, sans-serif'; c.fillStyle = '#aaa';\n  const rw = roomW(), rd = roomD();\n  const subtitle = `${state.openArea ? 'Open area' : 'Room'}: ${rw}m × ${rd}m  |  Work-plane: ${workPlane()}m  |  Lights: ${state.lights.length}  |  Max: ${fmtLux(state.maxLux)} lux  |  ${new Date().toLocaleDateString()}`;\n  c.fillText(subtitle, 50, 96);\n\n  const mapMargin = 70, mapTop = 130, mapBot = 90;\n  const rightPanelW = 680;\n  const mapW = PW - rightPanelW - mapMargin * 2 - 20;\n  const mapH = PH - mapTop - mapBot;\n\n  // bounding box: polygon if defined, else full rectangle\n  let bbMinX = 0, bbMinY = 0, bbMaxX = rw, bbMaxY = rd;\n  if (state.roomPolygon.length >= 3) {\n    bbMinX = Math.min(...state.roomPolygon.map(p => p.x));\n    bbMinY = Math.min(...state.roomPolygon.map(p => p.y));\n    bbMaxX = Math.max(...state.roomPolygon.map(p => p.x));\n    bbMaxY = Math.max(...state.roomPolygon.map(p => p.y));\n    const padX = (bbMaxX - bbMinX) * 0.06;\n    const padY = (bbMaxY - bbMinY) * 0.06;\n    bbMinX = Math.max(0,  bbMinX - padX);\n    bbMinY = Math.max(0,  bbMinY - padY);\n    bbMaxX = Math.min(rw, bbMaxX + padX);\n    bbMaxY = Math.min(rd, bbMaxY + padY);\n  }\n  const bbW = bbMaxX - bbMinX, bbH = bbMaxY - bbMinY;\n\n  const mScale = Math.min(mapW / bbW, mapH / bbH);\n  const mOffX  = mapMargin + (mapW - bbW * mScale) / 2;\n  const mOffY  = mapTop    + (mapH - bbH * mScale) / 2;\n\n  function mw2c(wx, wy) { return [(wx - bbMinX) * mScale + mOffX, (wy - bbMinY) * mScale + mOffY]; }\n\n  // canvas corners of the bounding box (used for grid, labels, scale bar)\n  const bx0 = mOffX, by0 = mOffY;\n  const bx1 = mOffX + bbW * mScale, by1 = mOffY + bbH * mScale;\n\n  if (state.bgImage) {\n    const bgOpacity = (parseFloat(document.getElementById('bgOpacity').value) || 30) / 100;\n    const bgS  = (parseFloat(document.getElementById('bgScale').value) || 100) / 100;\n    const bgX  = parseFloat(document.getElementById('bgOffX').value) || 0;\n    const bgY  = parseFloat(document.getElementById('bgOffY').value) || 0;\n    const imgW = rw * bgS * mScale;\n    const imgH = imgW * (state.bgImage.naturalHeight / state.bgImage.naturalWidth);\n    const [ibx, iby] = mw2c(bgX, bgY);\n    const [emx0, emy0] = mw2c(0, 0);\n    const [emx1, emy1] = mw2c(rw, rd);\n    c.save();\n    c.beginPath(); c.rect(emx0, emy0, emx1 - emx0, emy1 - emy0); c.clip();\n    c.globalAlpha = bgOpacity;\n    c.drawImage(state.bgImage, ibx, iby, imgW, imgH);\n    c.restore();\n  }\n\n  const hm  = state.heatmap;\n  const off = document.createElement('canvas');\n  off.width  = hm.cols; off.height = hm.rows;\n  off.getContext('2d').putImageData(hm.imgData, 0, 0);\n  c.imageSmoothingEnabled = true;\n  c.imageSmoothingQuality = 'high';\n  const [mx0,my0] = mw2c(0,0);\n  const [mx1,my1] = mw2c(rw,rd);\n  c.drawImage(off, mx0, my0, mx1-mx0, my1-my0);\n\n  renderTargetOverlay(c, mw2c);\n  renderEmergencyOverlay(c, mw2c);\n\n  if (state.roomPolygon.length >= 3) {\n    c.beginPath();\n    const [fp0x, fp0y] = mw2c(state.roomPolygon[0].x, state.roomPolygon[0].y);\n    c.moveTo(fp0x, fp0y);\n    for (let i = 1; i < state.roomPolygon.length; i++) {\n      const [fpx, fpy] = mw2c(state.roomPolygon[i].x, state.roomPolygon[i].y);\n      c.lineTo(fpx, fpy);\n    }\n    c.closePath();\n    c.strokeStyle = '#333'; c.lineWidth = 3; c.setLineDash([]); c.stroke();\n  } else {\n    c.strokeStyle = state.openArea ? '#888' : '#333';\n    c.lineWidth   = state.openArea ? 1.5 : 3;\n    state.openArea ? c.setLineDash([10,6]) : c.setLineDash([]);\n    c.strokeRect(mx0, my0, mx1-mx0, my1-my0);\n  }\n  c.setLineDash([]);\n\n  for (const w of state.wallSegments) {\n    const [ewx1, ewy1] = mw2c(w.x1, w.y1);\n    const [ewx2, ewy2] = mw2c(w.x2, w.y2);\n    c.beginPath(); c.moveTo(ewx1, ewy1); c.lineTo(ewx2, ewy2);\n    c.strokeStyle = '#555'; c.lineWidth = 3; c.lineCap = 'round'; c.stroke();\n    c.lineCap = 'butt';\n  }\n\n  c.strokeStyle = 'rgba(0,0,0,0.12)'; c.lineWidth = 0.8;\n  const gs = exportGridStep(bbW, bbH, mapW);\n  const gxStart = Math.ceil(bbMinX / gs) * gs;\n  const gyStart = Math.ceil(bbMinY / gs) * gs;\n  for (let gx = gxStart; gx <= bbMaxX+.001; gx += gs) { const [cx] = mw2c(gx, bbMinY); c.beginPath(); c.moveTo(cx,by0); c.lineTo(cx,by1); c.stroke(); }\n  for (let gy = gyStart; gy <= bbMaxY+.001; gy += gs) { const [,cy] = mw2c(bbMinX, gy); c.beginPath(); c.moveTo(bx0,cy); c.lineTo(bx1,cy); c.stroke(); }\n\n  drawScaleBar(c, bx0 + 10, by1 + 20, mScale, '#444');\n\n  c.fillStyle = '#444'; c.font = '22px Segoe UI, sans-serif'; c.textAlign = 'center';\n  c.fillText(bbW.toFixed(1) + ' m', (bx0+bx1)/2, by1+56);\n  c.save(); c.translate(bx0-40, (by0+by1)/2); c.rotate(-Math.PI/2);\n  c.fillText(bbH.toFixed(1) + ' m', 0, 0); c.restore();\n\n  for (const L of state.lights) {\n    const [lx,ly] = mw2c(L.x, L.y);\n    const tint = cctTint(L.cct);\n    const tr   = t => Math.round(t*255);\n    const tc   = `rgb(${tr(tint[0])},${tr(tint[1])},${tr(tint[2])})`;\n\n    if (L.shape === 'linear') {\n      const len = L.length || 1.2;\n      const rad = ((L.rotation || 0) * Math.PI) / 180;\n      const [sx,sy] = mw2c(L.x - Math.cos(rad)*len/2, L.y - Math.sin(rad)*len/2);\n      const [ex,ey] = mw2c(L.x + Math.cos(rad)*len/2, L.y + Math.sin(rad)*len/2);\n      c.beginPath(); c.moveTo(sx,sy); c.lineTo(ex,ey);\n      c.strokeStyle = tc; c.lineWidth = 5; c.lineCap = 'round'; c.stroke();\n      c.strokeStyle = '#333'; c.lineWidth = 1.5; c.stroke();\n      c.lineCap = 'butt';\n      c.fillStyle = '#222'; c.font = 'bold 13px Segoe UI,sans-serif'; c.textAlign = 'left';\n      c.fillText(`L${L.id}`, lx+8, ly-6);\n    } else {\n      c.beginPath(); c.arc(lx, ly, 11, 0, Math.PI*2);\n      c.fillStyle = tc; c.fill();\n      c.strokeStyle = '#333'; c.lineWidth = 1.5; c.stroke();\n      c.fillStyle = '#222'; c.font = 'bold 13px Segoe UI,sans-serif'; c.textAlign = 'center';\n      c.fillText(`L${L.id}`, lx, ly + 4.5);\n    }\n  }\n\n  renderContours(c, mw2c, 2.5);\n\n  for (const L of state.lights) {\n    if ((L.aimTilt || 0) > 0) {\n      const [lx, ly] = mw2c(L.x, L.y);\n      const azRad = ((L.aimAz || 0) * Math.PI) / 180;\n      const arrowLen = (18 + (L.aimTilt / 90) * 18) * (mScale / 30);\n      const ax = lx + Math.cos(azRad) * arrowLen;\n      const ay = ly + Math.sin(azRad) * arrowLen;\n      c.save();\n      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 2;\n      c.beginPath(); c.moveTo(lx, ly); c.lineTo(ax, ay); c.stroke();\n      const ha = Math.atan2(ay - ly, ax - lx);\n      c.beginPath(); c.moveTo(ax, ay);\n      c.lineTo(ax - 8*Math.cos(ha-0.4), ay - 8*Math.sin(ha-0.4));\n      c.lineTo(ax - 8*Math.cos(ha+0.4), ay - 8*Math.sin(ha+0.4));\n      c.closePath(); c.fillStyle = 'rgba(255,255,255,0.8)'; c.fill();\n      c.restore();\n    }\n  }\n\n  for (const p of state.pins) {\n    const [px,py] = mw2c(p.x, p.y);\n    const pr = 14;\n    c.beginPath(); c.arc(px, py-pr, pr, 0, Math.PI*2); c.fillStyle = red; c.fill();\n    c.beginPath(); c.moveTo(px-pr*0.55,py-pr); c.lineTo(px,py+3); c.lineTo(px+pr*0.55,py-pr);\n    c.fillStyle = red; c.fill();\n    c.fillStyle = '#fff'; c.font = 'bold 12px Segoe UI,sans-serif'; c.textAlign='center';\n    c.fillText(`${p.id}`, px, py - pr + 5);\n    // lux label\n    const txt = `${fmtLux(p.lux)} lx`;\n    c.font = '14px Segoe UI,sans-serif';\n    const tw = c.measureText(txt).width;\n    c.fillStyle = 'rgba(0,0,0,0.78)';\n    c.beginPath(); c.roundRect(px+pr+2, py-pr*2-4, tw+12, 20, 4); c.fill();\n    c.fillStyle = '#fff'; c.textAlign = 'left';\n    c.fillText(txt, px+pr+8, py-pr*2+12);\n  }\n\n  const rpX = PW - rightPanelW + 30;\n  let   rpY = mapTop + 14;\n  const rpW = rightPanelW - 60;\n\n  const expScaleMax = scaleMax();\n  c.fillStyle = dark; c.font = 'bold 26px Segoe UI,sans-serif'; c.textAlign='left';\n  c.fillText('ILLUMINANCE (LUX)', rpX, rpY); rpY += 32;\n  const gradBar = c.createLinearGradient(rpX, 0, rpX+rpW, 0);\n  [0,0.12,0.30,0.50,0.70,0.88,1.0].forEach(t => {\n    const [R,G,B] = luxToColor(t,1);\n    gradBar.addColorStop(t, `rgb(${R},${G},${B})`);\n  });\n  c.fillStyle = gradBar;\n  c.fillRect(rpX, rpY, rpW, 28);\n  c.strokeStyle='#bbb'; c.lineWidth=1.5; c.strokeRect(rpX, rpY, rpW, 28);\n  c.strokeStyle='rgba(0,0,0,0.3)'; c.lineWidth=1;\n  [0.25,0.50,0.75].forEach(t => {\n    const tx = rpX + rpW*t;\n    c.beginPath(); c.moveTo(tx, rpY+28); c.lineTo(tx, rpY+38); c.stroke();\n  });\n  c.fillStyle='#444'; c.font='18px Segoe UI,sans-serif';\n  c.textAlign='left';   c.fillText('0', rpX, rpY+54);\n  c.textAlign='center'; c.fillText(fmtLux(expScaleMax*0.25), rpX+rpW*0.25, rpY+54);\n  c.textAlign='center'; c.fillText(fmtLux(expScaleMax*0.50), rpX+rpW*0.50, rpY+54);\n  c.textAlign='center'; c.fillText(fmtLux(expScaleMax*0.75), rpX+rpW*0.75, rpY+54);\n  c.textAlign='right';  c.fillText(fmtLux(expScaleMax)+' lux', rpX+rpW, rpY+54);\n  rpY += 80;\n\n  function divider(label) {\n    c.fillStyle='#ccc'; c.fillRect(rpX, rpY, rpW, 1.5); rpY += 14;\n    c.fillStyle=dark; c.font='bold 24px Segoe UI,sans-serif'; c.textAlign='left';\n    c.fillText(label, rpX, rpY); rpY += 32;\n  }\n\n  function tableRow(cols, bold, bg) {\n    const colW = rpW / cols.length;\n    const rowH = 28;\n    if (bg) { c.fillStyle=bg; c.fillRect(rpX, rpY-20, rpW, rowH); }\n    c.font = bold ? 'bold 20px Segoe UI,sans-serif' : '19px Segoe UI,sans-serif';\n    c.fillStyle = bold ? dark : '#333';\n    cols.forEach((txt, i) => {\n      c.textAlign = i === 0 ? 'left' : 'right';\n      const x = i === 0 ? rpX+4 : rpX + colW*(i+1) - 4;\n      c.fillText(String(txt), x, rpY);\n    });\n    rpY += rowH;\n  }\n\n  if (state.simulated) {\n    divider('SIMULATION STATISTICS');\n    const uni = state.avgLux > 0 ? state.minLux / state.avgLux : 0;\n    const statItems = [\n      ['Max illuminance', fmtLux(state.maxLux) + ' lx'],\n      ['Avg illuminance', fmtLux(state.avgLux) + ' lx'],\n      ['Min illuminance', fmtLux(state.minLux) + ' lx'],\n      ['Uniformity (min/avg)', uni.toFixed(2) + (uni >= 0.6 ? '  ✓ EN 12464' : '')],\n    ];\n    if (document.getElementById('showTarget').checked) {\n      const tgt = parseFloat(document.getElementById('targetLux').value) || 300;\n      statItems.push(['Target lux', fmtLux(tgt) + ' lx (overlay shown)']);\n    }\n    for (const [label, val] of statItems) {\n      c.font = '19px Segoe UI,sans-serif'; c.fillStyle = '#333';\n      c.textAlign = 'left';  c.fillText(label, rpX + 4, rpY);\n      c.textAlign = 'right'; c.fillText(val, rpX + rpW - 4, rpY);\n      rpY += 28;\n    }\n    rpY += 14;\n  }\n\n  if (state.pins.length) {\n    divider('MEASUREMENT PINS');\n    tableRow(['Pin','Position','Lux','% Max'], true, '#eee');\n    for (const p of state.pins) {\n      const pct = expScaleMax > 0 ? ((p.lux/expScaleMax)*100).toFixed(0)+'%' : '—';\n      tableRow([`P${p.id}`, `(${p.x.toFixed(1)}, ${p.y.toFixed(1)}) m`, fmtLux(p.lux)+' lx', pct]);\n    }\n    rpY += 14;\n  }\n\n  divider('LIGHT SCHEDULE');\n  tableRow(['ID','Position','Type','lm','Beam','Height','CCT'], true, '#eee');\n  for (const L of state.lights) {\n    const typeStr = L.shape === 'linear'\n      ? `Linear ${(L.length||1.2).toFixed(1)}m @${(L.rotation||0)}°`\n      : 'Point';\n    tableRow([\n      `L${L.id}`,\n      `${L.x.toFixed(1)}, ${L.y.toFixed(1)} m`,\n      typeStr,\n      L.lumens+' lm',\n      L.beamAngle+'°',\n      L.mountH+' m',\n      L.cct+' K',\n    ]);\n  }\n\n  c.fillStyle='#aaa'; c.font='18px Segoe UI,sans-serif'; c.textAlign='right';\n  c.fillText('Light Dispersion Simulator', PW-50, PH-24);\n\n  oc.toBlob(blob => {\n    const a   = document.createElement('a');\n    a.href    = URL.createObjectURL(blob);\n    a.download = (document.getElementById('projectTitle').value || 'light-sim') + '.png';\n    a.click();\n  }, 'image/png');\n}\n\nfunction exportGridStep(rw, rd, mapW) {\n  const steps = [0.5,1,2,5,10,20,50];\n  const mScale = mapW / rw;\n  return steps.find(s => s * mScale >= 50) || 50;\n}\n\nfunction drawScaleBar(c, x, y, scale, color) {\n  const nice = [0.5,1,2,5,10,20,50].find(s => s*scale >= 60) || 50;\n  const len  = nice * scale;\n  c.strokeStyle = color; c.lineWidth = 2;\n  c.beginPath(); c.moveTo(x,y); c.lineTo(x+len,y); c.stroke();\n  c.beginPath(); c.moveTo(x,y-6); c.lineTo(x,y+6); c.stroke();\n  c.beginPath(); c.moveTo(x+len,y-6); c.lineTo(x+len,y+6); c.stroke();\n  c.fillStyle = color; c.font='20px Segoe UI,sans-serif'; c.textAlign='center';\n  c.fillText(nice >= 1 ? nice+'m' : (nice*100)+'cm', x+len/2, y-10);\n}\n\nupdateLegendBar();\nresize();\nfitView();\ndraw();\n\n// ── MOBILE PANEL\n\nfunction isMobile() { return window.innerWidth <= 768; }\n\nfunction openMobilePanel() {\n  document.getElementById('sidebar').classList.add('mobile-open');\n  document.getElementById('mobile-backdrop').classList.add('active');\n  document.getElementById('mobile-fab').innerHTML = \"<svg viewBox=\\\"0 0 512 512\\\" width=\\\"1em\\\" height=\\\"1em\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"44\\\" stroke-linecap=\\\"round\\\" style=\\\"pointer-events:none\\\"><path d=\\\"M368 368 144 144M368 144 144 368\\\"/><\u002Fsvg>\";\n}\n\nfunction closeMobilePanel() {\n  document.getElementById('sidebar').classList.remove('mobile-open');\n  document.getElementById('mobile-backdrop').classList.remove('active');\n  document.getElementById('mobile-fab').innerHTML = \"<svg viewBox=\\\"0 0 512 512\\\" width=\\\"1em\\\" height=\\\"1em\\\" fill=\\\"currentColor\\\" style=\\\"pointer-events:none\\\"><path d=\\\"M256 176a80 80 0 1080 80 80 80 0 00-80-80zm198 0-33-10-19-46 16-31a12 12 0 00-2-14l-33-33a12 12 0 00-14-2l-31 16-46-19-10-33a12 12 0 00-12-9h-46a12 12 0 00-12 9l-10 33-46 19-31-16a12 12 0 00-14 2l-33 33a12 12 0 00-2 14l16 31-19 46-33 10a12 12 0 00-9 12v46a12 12 0 009 12l33 10 19 46-16 31a12 12 0 002 14l33 33a12 12 0 0014 2l31-16 46 19 10 33a12 12 0 0012 9h46a12 12 0 0012-9l10-33 46-19 31 16a12 12 0 0014-2l33-33a12 12 0 002-14l-16-31 19-46 33-10a12 12 0 009-12v-46a12 12 0 00-9-12z\\\"/><\u002Fsvg>\";\n}\n\ndocument.getElementById('mobile-fab').addEventListener('click', () => {\n  document.getElementById('sidebar').classList.contains('mobile-open')\n    ? closeMobilePanel() : openMobilePanel();\n});\n\ndocument.getElementById('mobile-backdrop').addEventListener('click', closeMobilePanel);\n\n// ── TOUCH EVENTS\n\nconst ts = { pinching: false, lastDist: 0, lastMidX: 0, lastMidY: 0, startCX: 0, startCY: 0, moved: false };\n\ncanvas.addEventListener('touchstart', e => {\n  e.preventDefault();\n  if (e.touches.length >= 2) {\n    ts.pinching = true;\n    state.dragging = null; state.panning = null;\n    const t0 = e.touches[0], t1 = e.touches[1];\n    ts.lastDist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);\n    ts.lastMidX = (t0.clientX + t1.clientX) / 2;\n    ts.lastMidY = (t0.clientY + t1.clientY) / 2;\n    return;\n  }\n  ts.pinching = false;\n  const t = e.touches[0];\n  const rect = canvas.getBoundingClientRect();\n  const cx = t.clientX - rect.left, cy = t.clientY - rect.top;\n  const [wx, wy] = c2w(cx, cy);\n  ts.startCX = cx; ts.startCY = cy; ts.moved = false;\n\n  if (state.mode === 'ruler') {\n    state.ruler = { x1: wx, y1: wy, x2: wx, y2: wy };\n    state.rulerDragging = true;\n    return;\n  }\n  if (state.mode === 'place') return;\n  if (state.mode === 'pin')   return;\n  if (state.mode === 'array') return;\n  if (state.mode === 'draw-room' || state.mode === 'draw-wall') {\n    state.panning = { startX: t.clientX, startY: t.clientY, origPanX: state.panX, origPanY: state.panY };\n    return;\n  }\n\n  for (const p of state.pins) {\n    const [px, py] = w2c(p.x, p.y);\n    if (Math.hypot(cx - px, cy - (py - 8)) < 20) { selectPin(p.id); return; }\n  }\n  for (const L of state.lights) {\n    const [lx, ly] = w2c(L.x, L.y);\n    if (Math.hypot(cx - lx, cy - ly) < 20) {\n      selectLight(L.id);\n      recordHistory();\n      state.dragging = { id: L.id, startWX: wx, startWY: wy, origX: L.x, origY: L.y };\n      return;\n    }\n  }\n  state.panning = { startX: t.clientX, startY: t.clientY, origPanX: state.panX, origPanY: state.panY };\n}, { passive: false });\n\ncanvas.addEventListener('touchmove', e => {\n  e.preventDefault();\n  if (e.touches.length >= 2) {\n    const t0 = e.touches[0], t1 = e.touches[1];\n    const dist = Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);\n    const mx = (t0.clientX + t1.clientX) / 2;\n    const my = (t0.clientY + t1.clientY) / 2;\n    const rect = canvas.getBoundingClientRect();\n    const cx = mx - rect.left, cy = my - rect.top;\n    const factor = ts.lastDist > 0 ? dist / ts.lastDist : 1;\n    state.panX = cx - (cx - state.panX) * factor;\n    state.panY = cy - (cy - state.panY) * factor;\n    state.zoom = Math.max(4, Math.min(600, state.zoom * factor));\n    state.panX += mx - ts.lastMidX;\n    state.panY += my - ts.lastMidY;\n    ts.lastDist = dist; ts.lastMidX = mx; ts.lastMidY = my;\n    draw(); return;\n  }\n  if (e.touches.length === 1 && !ts.pinching) {\n    const t = e.touches[0];\n    const rect = canvas.getBoundingClientRect();\n    const cx = t.clientX - rect.left, cy = t.clientY - rect.top;\n    const [wx, wy] = c2w(cx, cy);\n    state.mouseWorld.x = wx; state.mouseWorld.y = wy;\n    if (Math.hypot(cx - ts.startCX, cy - ts.startCY) > 6) ts.moved = true;\n    if (state.dragging) {\n      const d = state.dragging;\n      const L = state.lights.find(l => l.id === d.id);\n      if (L) {\n        L.x = snap(Math.max(0, Math.min(roomW(), d.origX + wx - d.startWX)));\n        L.y = snap(Math.max(0, Math.min(roomD(), d.origY + wy - d.startWY)));\n        invalidateSim(); refreshLightList(); draw();\n      }\n    } else if (state.panning) {\n      state.panX = state.panning.origPanX + (t.clientX - state.panning.startX);\n      state.panY = state.panning.origPanY + (t.clientY - state.panning.startY);\n      draw();\n    } else if (state.rulerDragging && state.ruler) {\n      state.ruler.x2 = wx; state.ruler.y2 = wy;\n      const dist = Math.hypot(wx - state.ruler.x1, wy - state.ruler.y1);\n      const ro = document.getElementById('ruler-readout');\n      ro.textContent = dist < 1 ? (dist*100).toFixed(0)+' cm' : dist.toFixed(2)+' m';\n      ro.style.display = 'block';\n      draw();\n    }\n  }\n}, { passive: false });\n\ncanvas.addEventListener('touchend', e => {\n  e.preventDefault();\n  if (e.touches.length === 0) ts.pinching = false;\n  if (!ts.moved && !ts.pinching && e.changedTouches.length > 0) {\n    const t = e.changedTouches[0];\n    const rect = canvas.getBoundingClientRect();\n    const tcx = t.clientX - rect.left, tcy = t.clientY - rect.top;\n    const [wx, wy] = c2w(tcx, tcy);\n    if (state.mode === 'place') {\n      addLight(Math.max(0, Math.min(roomW(), wx)), Math.max(0, Math.min(roomD(), wy)));\n    } else if (state.mode === 'place-window') {\n      const snap = snapToWall(wx, wy);\n      placeWindowAtSnap(snap);\n    } else if (state.mode === 'pin' && state.simulated) {\n      addPin(Math.max(0, Math.min(roomW(), wx)), Math.max(0, Math.min(roomD(), wy)));\n    } else if (state.mode === 'draw-room') {\n      const pt = { x: snap(wx), y: snap(wy) };\n      if (state.roomPolygon.length >= 3) {\n        const [fx, fy] = w2c(state.roomPolygon[0].x, state.roomPolygon[0].y);\n        if (Math.hypot(tcx - fx, tcy - fy) < 24) { closeRoomPolygon(); return; }\n      }\n      recordHistory();\n      state.roomPolygon.push(pt);\n      invalidateSim(); refreshWallList(); draw(); scheduleAutoSave();\n    } else if (state.mode === 'draw-wall') {\n      const pt = { x: snap(wx), y: snap(wy) };\n      if (!state.drawingWall) {\n        state.drawingWall = pt;\n      } else {\n        if (Math.hypot(pt.x - state.drawingWall.x, pt.y - state.drawingWall.y) > 0.01) {\n          addWallSegment(state.drawingWall.x, state.drawingWall.y, pt.x, pt.y);\n        }\n        state.drawingWall = null;\n      }\n      draw();\n    }\n  }\n  if (e.touches.length === 0) {\n    state.dragging = null; state.panning = null;\n    if (state.rulerDragging) { state.rulerDragging = false; draw(); }\n  }\n}, { passive: false });\n\ndocument.addEventListener('gesturestart',  e => e.preventDefault(), { passive: false });\ndocument.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });\ndocument.addEventListener('gestureend',    e => e.preventDefault(), { passive: false });\ndocument.addEventListener('touchmove', e => {\n  if (e.touches.length > 1) e.preventDefault();\n}, { passive: false });\n\n// ═══════════════════════════════════════════════════════════════\n// UNDO / REDO\n// ═══════════════════════════════════════════════════════════════\n\nconst _history = { past: [], future: [] };\n\nfunction captureSnapshot() {\n  const domIds = ['roomW','roomD','areaW','areaD','workPlane','roomH',\n    'reflCeil','reflWalls','reflFloor','reflBounces','openArea',\n    'lumens','beamAngle','mountH','cct','llf','distrib','shape',\n    'lightLength','lightRotation','aimTilt','aimAz',\n    'projectTitle','luxScale','customLuxMax','targetLux','contourLevels',\n    'showTarget','showContours','showEmerg','emergStd',\n    'bgScale',' ap.nextScenarioId || 1;\n  state.activeScenarioId = snap.activeScenarioId ?? null;\n\n  for (const [id, val] of Object.entries(snap.dom || {})) {\n    const el = document.getElementById(id);\n    if (!el) continue;\n    if (el.type === 'checkbox') el.checked = val;\n    else el.value = val;\n  }\n  const open = document.getElementById('openArea').checked;\n  document.getElementById('room-dims').classList.toggle('hidden',  open);\n  document.getElementById('open-dims').classList.toggle('hidden', !open);\n  document.getElementById('room-h-label').classList.toggle('hidden', open);\n  document.getElementById('reflectance-section').classList.toggle('hidden', open);\n  const isLinear = document.getElementById('shape').value === 'linear';\n  document.getElementById('linear-opts').classList.toggle('hidden', !isLinear);\n  document.getElementById('aim-az-row').style.display = isLinear ? 'none' : '';\n  const selL = state.lights.find(l => l.id === state.selectedLightId);\n  if (!selL) { state.selectedLightId = null; loadSpec(null); }\n\n  invalidateSim();\n  refreshLightList(); refreshPinList(); refreshWallList();\n  refreshWindowList(); refreshScenarioList();\n  fitView(); draw();\n}\n\nfunction undo() {\n  if (!_history.past.length) return;\n  _history.future.push(captureSnapshot());\n  applySnapshot(_history.past.pop());\n  updateUndoButtons();\n}\n\nfunction redo() {\n  if (!_history.future.length) return;\n  _history.past.push(captureSnapshot());\n  applySnapshot(_history.future.pop());\n  updateUndoButtons();\n}\n\nfunction updateUndoButtons() {\n  document.getElementById('btn-undo').disabled = _history.past.length === 0;\n  document.getElementById('btn-redo').disabled = _history.future.length === 0;\n}\n\ndocument.getElementById('btn-undo').addEventListener('click', undo);\ndocument.getElementById('btn-redo').addEventListener('click', redo);\n\n// ═══════════════════════════════════════════════════════════════\n// SAVE / LOAD / AUTO-SAVE\n// ═══════════════════════════════════════════════════════════════\n\nlet _autoSaveTimer = null;\nfunction scheduleAutoSave() {\n  clearTimeout(_autoSaveTimer);\n  _autoSaveTimer = setTimeout(() => {\n    try {\n      const data = JSON.stringify(getProjectData());\n      localStorage.setItem('lightSimProject', data);\n      document.getElementById('autosave-status').textContent = 'Auto-saved ✓  ' + new Date().toLocaleTimeString();\n    } catch(e) {\n      document.getElementById('autosave-status').textContent = 'Auto-save failed (storage full?)';\n    }\n  }, 900);\n}\n\nfunction getProjectData() {\n  return { version: 2, ...captureSnapshot() };\n}\n\nfunction saveProjectJSON() {\n  const title = document.getElementById('projectTitle').value || 'light-sim';\n  const blob = new Blob([JSON.stringify(getProjectData(), null, 2)], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = title.replace(/[^a-z0-9_-]/gi, '_') + '.json';\n  a.click();\n}\n\nfunction loadProjectFromData(data) {\n  if (!data || !data.lights) { alert('Invalid project file.'); return; }\n  recordHistory();\n  applySnapshot(data);\n  scheduleAutoSave();\n}\n\nfunction loadAutoSave() {\n  try {\n    const saved = localStorage.getItem('lightSimProject');\n    if (!saved) return;\n    const data = JSON.parse(saved);\n    if (data && data.lights) { applySnapshot(data); updateUndoButtons(); }\n  } catch(e) {}\n}\n\ndocument.getElementById('btn-save-json').addEventListener('click', saveProjectJSON);\ndocument.getElementById('btn-load-json').addEventListener('click', () => document.getElementById('load-json-file').click());\ndocument.getElementById('load-json-file').addEventListener('change', e => {\n  const file = e.target.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = ev => {\n    try { loadProjectFromData(JSON.parse(ev.target.result)); }\n    catch(err) { alert('Could not parse file: ' + err.message); }\n  };\n  reader.readAsText(file);\n  e.target.value = '';\n});\n\n// ═══════════════════════════════════════════════════════════════\n// SCENARIOS\n// ═══════════════════════════════════════════════════════════════\n\nfunction getEffectiveLights(scenarioId) {\n  if (!scenarioId) return state.lights;\n  const sc = state.scenarios.find(s => s.id === scenarioId);\n  if (!sc) return state.lights;\n  return state.lights.map(l => {\n    const ov = sc.lightOverrides[l.id];\n    if (ov && ov.enabled === false) return null;\n    if (ov && ov.dimFactor != null && ov.dimFactor !== 1) {\n      return { ...l, lumens: l.lumens * ov.dimFactor };\n    }\n    return l;\n  }).filter(Boolean);\n}\n\nfunction addScenario() {\n  recordHistory();\n  const id = state.nextScenarioId++;\n  const overrides = {};\n  state.lights.forEach(l => { overrides[l.id] = { enabled: true, dimFactor: 1 }; });\n  state.scenarios.push({ id, name: `Scenario ${id}`, lightOverrides: overrides });\n  state.activeScenarioId = id;\n  refreshScenarioList(); scheduleAutoSave();\n}\n\nfunction removeScenario(id) {\n  recordHistory();\n  state.scenarios = state.scenarios.filter(s => s.id !== id);\n  if (state.activeScenarioId === id) state.activeScenarioId = null;\n  if (state.compareLeftId === id) state.compareLeftId = null;\n  if (state.compareRightId === id) state.compareRightId = null;\n  refreshScenarioList(); scheduleAutoSave();\n}\n\nfunction setActiveScenario(id) {\n  state.activeScenarioId = id;\n  refreshScenarioList();\n}\n\nfunction getScenarioName(id) {\n  if (!id) return 'Default (all lights)';\n  const sc = state.scenarios.find(s => s.id === id);\n  return sc ? sc.name : 'Unknown';\n}\n\nfunction refreshScenarioList() {\n  const el = document.getElementById('scenario-list');\n  el.innerHTML = '';\n\n  const makeItem = (id, name) => {\n    const div = document.createElement('div');\n    div.className = 'sc-item' + (state.activeScenarioId === id ? ' active-sc' : '');\n\n    const dot = document.createElement('div');\n    dot.className = 'sc-dot' + (state.activeScenarioId === id ? ' on' : '');\n    dot.title = 'Set as active scenario';\n    dot.addEventListener('click', () => { setActiveScenario(id); });\n    div.appendChild(dot);\n\n    const nameInput = document.createElement('input');\n    nameInput.type = 'text'; nameInput.className = 'sc-name'; nameInput.value = name;\n    if (id === null) { nameInput.readOnly = true; nameInput.style.cursor = 'default'; }\n    nameInput.addEventListener('change', () => {\n      const sc = state.scenarios.find(s => s.id === id);\n      if (sc) { sc.name = nameInput.value; scheduleAutoSave(); }\n    });\n    div.appendChild(nameInput);\n\n    if (id !== null) {\n      const sc = state.scenarios.find(s => s.id === id);\n      if (sc) {\n        const editBtn = document.createElement('button');\n        editBtn.innerHTML = \"<svg viewBox=\\\"0 0 512 512\\\" width=\\\"1em\\\" height=\\\"1em\\\" fill=\\\"none\\\" stroke=\\\"currentColor\\\" stroke-width=\\\"34\\\" stroke-linejoin=\\\"round\\\" style=\\\"pointer-events:none\\\"><path d=\\\"m364 74 74 74-232 232-92 18 18-92z\\\"/><\u002Fsvg>\"; editBtn.title = 'Edit light states';\n        editBtn.addEventListener('click', () => openScenarioEditor(id));\n        div.appendChild(editBtn);\n      }\n      const rmBtn = document.createElement('button');\n      rmBtn.textContent = '✕'; rmBtn.title = 'Remove';\n      rmBtn.addEventListener('click', () => removeScenario(id));\n      div.appendChild(rmBtn);\n    }\n    return div;\n  };\n\n  el.appendChild(makeItem(null, 'Default (all lights)'));\n  state.scenarios.forEach(sc => el.appendChild(makeItem(sc.id, sc.name)));\n\n  const hasScenarios = state.scenarios.length > 0;\n  document.getElementById('compare-controls').style.display = hasScenarios ? '' : 'none';\n  if (hasScenarios) populateCompareSelects();\n}\n\nfunction populateCompareSelects() {\n  const options = [{ id: null, name: 'Default (all lights)' },\n    ...state.scenarios.map(s => ({ id: s.id, name: s.name }))];\n  ['compare-left-sel','compare-right-sel'].forEach((elId, i) => {\n    const sel = document.getElementById(elId);\n    const current = elId === 'compare-left-sel' ? state.compareLeftId : state.compareRightId;\n    sel.innerHTML = options.map(o =>\n      `<option value=\"${o.id ?? ''}\" ${(o.id ?? '') === (current ?? '') ? 'selected' : ''}>${o.name}<\u002Foption>`\n    ).join('');\n  });\n}\n\nfunction openScenarioEditor(scenarioId) {\n  const sc = state.scenarios.find(s => s.id === scenarioId);\n  if (!sc || !state.lights.length) return;\n\n  const modal = document.createElement('div');\n  modal.style.cssText = 'position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;';\n  const inner = document.createElement('div');\n  inner.style.cssText = 'background:rgba(30,50,30,.96);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;width:340px;max-height:80vh;overflow-y:auto;';\n  inner.innerHTML = `<h3 style=\"font-size:13px;color:var(--text);margin-bottom:12px;\">Edit: ${sc.name}<\u002Fh3>\n    <p style=\"font-size:11px;color:var(--text-sec);margin-bottom:8px;\">Toggle lights on/off and set dimming per light.<\u002Fp>`;\n\n  state.lights.forEach(l => {\n    const ov = sc.lightOverrides[l.id] || { enabled: true, dimFactor: 1 };\n    const row = document.createElement('div');\n    row.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:12px;color:var(--text);';\n    row.innerHTML = `\n      <input type=\"checkbox\" ${ov.enabled !== false ? 'checked' : ''} id=\"sc-en-${l.id}\" style=\"accent-color:var(--primary);width:15px;height:15px;\">\n      <label for=\"sc-en-${l.id}\" style=\"flex:1;margin:0;color:var(--text);\">L${l.id} – ${l.lumens}lm @${l.mountH}m<\u002Flabel>\n      <input type=\"number\" value=\"${Math.round((ov.dimFactor ?? 1)*100)}\" min=\"5\" max=\"100\" step=\"5\" style=\"width:52px;font-size:11px;background:var(--input-bg);border:1px solid var(--input-border);color:var(--text);border-radius:3px;padding:2px 4px;\" id=\"sc-dim-${l.id}\">\n      <span style=\"font-size:10px;color:var(--text-sec);\">%<\u002Fspan>`;\n    inner.appendChild(row);\n  });\n\n  const footer = document.createElement('div');\n  footer.style.cssText = 'display:flex;gap:6px;margin-top:12px;';\n  const saveBtn = document.createElement('button');\n  saveBtn.className = 'btn-primary'; saveBtn.textContent = 'Save'; saveBtn.style.flex = '1';\n  saveBtn.addEventListener('click', () => {\n    recordHistory();\n    state.lights.forEach(l => {\n      sc.lightOverrides[l.id] = {\n        enabled:   document.getElementById('sc-en-'+ l.id).checked,\n        dimFactor: (parseFloat(document.getElementById('sc-dim-'+l.id).value) || 100) / 100,\n      };\n    });\n    document.body.removeChild(modal);\n    scheduleAutoSave(); invalidateSim();\n  });\n  const cancelBtn = document.createElement('button');\n  cancelBtn.className = 'btn-secondary'; cancelBtn.textContent = 'Cancel'; cancelBtn.style.flex = '1';\n  cancelBtn.addEventListener('click', () => document.body.removeChild(modal));\n  footer.appendChild(saveBtn); footer.appendChild(cancelBtn);\n  inner.appendChild(footer);\n  modal.appendChild(inner);\n  document.body.appendChild(modal);\n}\n\nfunction simulateForScenario(scenarioId) {\n  const effectiveLights = getEffectiveLights(scenarioId);\n  const rw = roomW(), rd = roomD(), wPlane = workPlane();\n  let gridW = rw, gridD = rd;\n  if (state.roomPolygon.length >= 3) {\n    gridW = Math.max(rw, Math.max(...state.roomPolygon.map(p => p.x)) + 1);\n    gridD = Math.max(rd, Math.max(...state.roomPolygon.map(p => p.y)) + 1);\n  }\n  const resolution = Math.max(0.04, Math.min(gridW, gridD) / 450);\n  const { grid, cols, rows } = computeLuxGrid(gridW, gridD, resolution, effectiveLights, wPlane);\n\n  if (!state.openArea) {\n    const nBounces = parseInt(document.getElementById('reflBounces').value) || 3;\n    const indirect = computeMultiBounce(grid, cols, rows, resolution, gridW, gridD, wPlane, roomH(), nBounces);\n    if (indirect) for (let i = 0; i < grid.length; i++) grid[i] += indirect[i];\n  }\n  if (state.windows.length > 0) {\n    const wg = computeWindowsLux(state.windows, state.sunConfig, gridW, gridD, wPlane, cols, rows, resolution);\n    for (let i = 0; i < grid.length; i++) if (grid[i] >= 0) grid[i] += wg[i];\n  }\n  if (state.roomPolygon.length >= 3) {\n    for (let r = 0; r < rows; r++)\n      for (let c = 0; c < cols; c++)\n        if (!pointInPolygon((c+0.5)*resolution,(r+0.5)*resolution,state.roomPolygon)) grid[r*cols+c]=-1;\n  }\n  let maxLux=0,minLux=Infinity,sumLux=0,countLux=0;\n  for (let i=0;i<grid.length;i++){if(grid[i]<0)continue;maxLux=Math.max(maxLux,grid[i]);minLux=Math.min(minLux,grid[i]);sumLux+=grid[i];countLux++;}\n  const avgLux=countLux>0?sumLux/countLux:0;\n  const minL=minLux===Infinity?0:minLux;\n  const sMax=scaleMax();\n  const imgData=new ImageData(cols,rows);\n  for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){const lux=grid[r*cols+c];const idx=(r*cols+c)*4;if(lux<0){imgData.data[idx+3]=0;continue;}const[R,G,B]=luxToColor(lux,sMax);imgData.data[idx]=R;imgData.data[idx+1]=G;imgData.data[idx+2]=B;imgData.data[idx+3]=210;}}\n  const hm={ imgData, cols, rows, rw: gridW, rd: gridD, resolution };\n  return { rawGrid: grid, heatmap: hm, maxLux, minLux: minL, avgLux };\n}\n\ndocument.getElementById('btn-add-scenario').addEventListener('click', addScenario);\n\ndocument.getElementById('btn-simulate-compare').addEventListener('click', () => {\n  const leftId  = document.getElementById('compare-left-sel').value  || null;\n  const rightId = document.getElementById('compare-right-sel').value || null;\n  state.compareLeftId  = leftId  ? parseInt(leftId)  : null;\n  state.compareRightId = rightId ? parseInt(rightId) : null;\n  const leftRes  = simulateForScenario(state.compareLeftId);\n  const rightRes = simulateForScenario(state.compareRightId);\n  state.simResults['left']  = leftRes;\n  state.simResults['right'] = rightRes;\n  state.compareMode = true;\n  document.getElementById('compare-labels').classList.add('visible');\n  document.getElementById('compare-divider').classList.add('visible');\n  document.getElementById('compare-label-left').textContent  = getScenarioName(state.compareLeftId);\n  document.getElementById('compare-label-right').textContent = getScenarioName(state.compareRightId);\n  document.getElementById('btn-exit-compare').style.display = '';\n  draw();\n});\n\ndocument.getElementById('btn-exit-compare').addEventListener('click', () => {\n  state.compareMode = false;\n  document.getElementById('compare-labels').classList.remove('visible');\n  document.getElementById('compare-divider').classList.remove('visible');\n  document.getElementById('btn-exit-compare').style.display = 'none';\n  draw();\n});\n\nfunction drawCompareSplit() {\n  const W = canvas.width, H = canvas.height;\n  ctx.clearRect(0,0,W,H);\n  ctx.fillStyle='#050805'; ctx.fillRect(0,0,W,H);\n\n  const leftRes  = state.simResults['left'];\n  const rightRes = state.simResults['right'];\n  if (!leftRes || !rightRes) { ctx.fillStyle='#555'; ctx.textAlign='center'; ctx.font='14px Segoe UI,sans-serif'; ctx.fillText('Run comparison first', W/2, H/2); return; }\n\n  const savedHm  = state.heatmap, savedRg = state.rawGrid;\n  const savedMax = state.maxLux,  savedMin = state.minLux, savedAvg = state.avgLux;\n\n  for (const [res, clipX, clipW] of [[leftRes,0,W/2],[rightRes,W/2,W/2]]) {\n    state.heatmap = res.heatmap; state.rawGrid = res.rawGrid; state.maxLux = res.maxLux;\n    ctx.save(); ctx.beginPath(); ctx.rect(clipX, 0, clipW, H); ctx.clip();\n    drawSceneCore(); ctx.restore();\n  }\n\n  state.heatmap = savedHm; state.rawGrid = savedRg;\n  state.maxLux = savedMax; state.minLux = savedMin; state.avgLux = savedAvg;\n\n  ctx.save();\n  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.setLineDash([6,4]);\n  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke();\n  ctx.setLineDash([]); ctx.restore();\n}\n\nfunction drawSceneCore() {\n  const rw = roomW(), rd = roomD();\n  const [x0,y0] = w2c(0,0), [x1,y1] = w2c(rw,rd);\n\n  if (state.bgImage) {\n    const opacity   = (parseFloat(document.getElementById('bgOpacity').value)||30)/100;\n    const bgS       = (parseFloat(document.getElementById('bgScale').value)||100)/100;\n    const bgX       = parseFloat(document.getElementById('bgOffX').value)||0;\n    const bgY       = parseFloat(document.getElementById('bgOffY').value)||0;\n    const imgWorldW = roomW()*bgS;\n    const imgWorldH = imgWorldW*(state.bgImage.naturalHeight/state.bgImage.naturalWidth);\n    const [ibx,iby]=w2c(bgX,bgY);\n    ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,x1-x0,y1-y0); ctx.clip();\n    ctx.globalAlpha=opacity; ctx.drawImage(state.bgImage,ibx,iby,imgWorldW*state.zoom,imgWorldH*state.zoom);\n    ctx.restore();\n  }\n\n  if (state.heatmap && state.heatmap.imgData) {\n    const hm=state.heatmap;\n    const off=document.createElement('canvas'); off.width=hm.cols; off.height=hm.rows;\n    off.getContext('2d').putImageData(hm.imgData,0,0);\n    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';\n    const [hx0,hy0]=w2c(0,0); const [hx1,hy1]=w2c(hm.rw,hm.rd);\n    ctx.drawImage(off,hx0,hy0,hx1-hx0,hy1-hy0);\n  }\n\n  drawTargetOverlay(); drawEmergencyOverlay();\n\n  if (state.roomPolygon.length===0&&state.mode!=='draw-room') {\n    if (!state.openArea){ctx.strokeStyle='#ccc';ctx.lineWidth=2;ctx.setLineDash([]);}\n    else{ctx.strokeStyle='#555';ctx.lineWidth=1;ctx.setLineDash([6,4]);}\n    ctx.strokeRect(x0,y0,x1-x0,y1-y0); ctx.setLineDash([]);\n  }\n\n  ctx.strokeStyle='rgba(255,255,255,0.045)'; ctx.lineWidth=0.5;\n  const gs=gridStep();\n  for(let gx=0;gx<=rw+.001;gx+=gs){const[cx]=w2c(gx,0);ctx.beginPath();ctx.moveTo(cx,y0);ctx.lineTo(cx,y1);ctx.stroke();}\n  for(let gy=0;gy<=rd+.001;gy+=gs){const[,cy]=w2c(0,gy);ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.stroke();}\n\n  ctx.fillStyle='rgba(255,255,255,0.42)';ctx.font='11px Segoe UI,sans-serif';ctx.textAlign='center';\n  ctx.fillText(rw.toFixed(1)+' m',(x0+x1)/2,y1+18);\n  ctx.save();ctx.translate(x0-20,(y0+y1)/2);ctx.rotate(-Math.PI/2);ctx.fillText(rd.toFixed(1)+' m',0,0);ctx.restore();\n\n  for (const L of state.lights) {\n    const [lx,ly]=w2c(L.x,L.y); const isSel=L.id===state.selectedLightId;\n    const tint=cctTint(L.cct); const tr=t=>Math.round(t*255);\n    const tc=`rgb(${tr(tint[0])},${tr(tint[1])},${tr(tint[2])})`;\n    if(L.shape==='linear'){\n      const len=L.length||1.2; const rad=((L.rotation||0)*Math.PI)/180;\n      const[sx,sy]=w2c(L.x-Math.cos(rad)*len/2,L.y-Math.sin(rad)*len/2);\n      const[ex,ey]=w2c(L.x+Math.cos(rad)*len/2,L.y+Math.sin(rad)*len/2);\n      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);\n      ctx.strokeStyle=tc;ctx.lineWidth=isSel?5:3;ctx.lineCap='round';ctx.stroke();ctx.lineCap='butt';\n      if(isSel){ctx.beginPath();ctx.arc(lx,ly,7,0,Math.PI*2);ctx.strokeStyle='#f5a623';ctx.lineWidth=2;ctx.stroke();}\n      ctx.fillStyle=isSel?'#f5a623':'#aaa';ctx.font='10px Segoe UI,sans-serif';ctx.textAlign='left';ctx.fillText(`L${L.id}`,lx+10,ly+4);\n    } else {\n      ctx.beginPath();ctx.arc(lx,ly,isSel?9:6,0,Math.PI*2);ctx.fillStyle=tc;ctx.fill();\n      if(isSel){ctx.strokeStyle='#f5a623';ctx.lineWidth=2;ctx.stroke();}\n      ctx.fillStyle=isSel?'#f5a623':'#aaa';ctx.font='10px Segoe UI,sans-serif';ctx.textAlign='left';ctx.fillText(`L${L.id}`,lx+10,ly+4);\n    }\n    if((L.aimTilt||0)>0){\n      const azRad=((L.aimAz||0)*Math.PI)/180;const arrowLen=18+(L.aimTilt/90)*18;\n      const ax=lx+Math.cos(azRad)*arrowLen;const ay=ly+Math.sin(azRad)*arrowLen;\n      ctx.save();ctx.strokeStyle=isSel?'#f5a623':'rgba(255,255,255,0.7)';ctx.lineWidth=2;\n      ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(ax,ay);ctx.stroke();\n      const hAngle=Math.atan2(ay-ly,ax-lx);\n      ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax-7*Math.cos(hAngle-0.4),ay-7*Math.sin(hAngle-0.4));ctx.lineTo(ax-7*Math.cos(hAngle+0.4),ay-7*Math.sin(hAngle+0.4));ctx.closePath();\n      ctx.fillStyle=isSel?'#f5a623':'rgba(255,255,255,0.7)';ctx.fill();ctx.restore();\n    }\n  }\n\n  if (document.getElementById('showContours').checked) drawContours();\n  drawWindows();\n\n  for(const p of state.pins){\n    const[px,py]=w2c(p.x,p.y);const isSel=p.id===state.selectedPinId;\n    drawPin(ctx,px,py,p.id,p.lux,isSel);\n  }\n  drawRuler();\n\n  if(state.roomPolygon.length>0){\n    ctx.save();ctx.strokeStyle='#4af';ctx.lineWidth=2;ctx.setLineDash([]);\n    const[p0x,p0y]=w2c(state.roomPolygon[0].x,state.roomPolygon[0].y);\n    ctx.beginPath();ctx.moveTo(p0x,p0y);\n    for(let i=1;i<state.roomPolygon.length;i++){const[vx,vy]=w2c(state.roomPolygon[i].x,state.roomPolygon[i].y);ctx.lineTo(vx,vy);}\n    if(state.mode!=='draw-room')ctx.closePath();\n    ctx.stroke();\n    ctx.fillStyle='#4af';\n    for(const v of state.roomPolygon){const[vx,vy]=w2c(v.x,v.y);ctx.beginPath();ctx.arc(vx,vy,4,0,Math.PI*2);ctx.fill();}\n    ctx.restore();\n  }\n\n  for(const w of state.wallSegments){\n    const[wx1,wy1]=w2c(w.x1,w.y1);const[wx2,wy2]=w2c(w.x2,w.y2);const isSel=w.id===state.selectedWallId;\n    ctx.save();ctx.strokeStyle=isSel?'#ff0':'#f84';ctx.lineWidth=isSel?4:3;ctx.lineCap='round';\n    ctx.beginPath();ctx.moveTo(wx1,wy1);ctx.lineTo(wx2,wy2);ctx.stroke();ctx.lineCap='butt';\n    if(isSel)drawMeasureLabel(ctx,wx1,wy1,wx2,wy2,w.x1,w.y1,w.x2,w.y2);\n    ctx.restore();\n  }\n}\n\n// ═══════════════════════════════════════════════════════════════\n// WINDOWS & DAYLIGHT\n// ═══════════════════════════════════════════════════════════════\n\nfunction addWindow() {\n  recordHistory();\n  const rw = roomW(), rd = roomD();\n  const wall = document.getElementById('win-wall').value;\n  const win = {\n    id:           state.nextWindowId++,\n    wall,\n    position:     parseFloat(document.getElementById('win-pos').value)     || 1,\n    width:        parseFloat(document.getElementById('win-width').value)   || 1.5,\n    height:       parseFloat(document.getElementById('win-height').value)  || 1.2,\n    sillHeight:   parseFloat(document.getElementById('win-sill').value)    || 0.9,\n    transmittance:parseFloat(document.getElementById('win-transmit').value)|| 0.7,\n  };\n  // Store edge geometry so polygon rooms work\n  const eg = getWinEdgeGeometry(win, rw, rd);\n  win.edgeX1 = eg.x1; win.edgeY1 = eg.y1; win.edgeX2 = eg.x2; win.edgeY2 = eg.y2;\n  win.inwardNx = eg.inx; win.inwardNy = eg.iny;\n  state.windows.push(win);\n  state.selectedWindowId = win.id;\n  invalidateSim(); refreshWindowList(); draw(); scheduleAutoSave();\n}\n\nfunction removeWindow(id) {\n  recordHistory();\n  state.windows = state.windows.filter(w => w.id !== id);\n  if (state.selectedWindowId === id) state.selectedWindowId = null;\n  invalidateSim(); refreshWindowList(); draw(); scheduleAutoSave();\n}\n\nfunction selectWindow(id) {\n  state.selectedWindowId = id;\n  const win = state.windows.find(w => w.id === id);\n  if (win) {\n    document.getElementById('win-wall').value     = win.wall;\n    document.getElementById('win-pos').value      = win.position;\n    document.getElementById('win-width').value    = win.width;\n    document.getElementById('win-height').value   = win.height;\n    document.getElementById('win-sill').value     = win.sillHeight;\n    document.getElementById('win-transmit').value = win.transmittance;\n  }\n  refreshWindowList(); draw();\n}\n\nfunction refreshWindowList() {\n  const ul = document.getElementById('window-list');\n  ul.innerHTML = '';\n  for (const w of state.windows) {\n    const li = document.createElement('li');\n    li.className = 'win-item' + (w.id === state.selectedWindowId ? ' selected' : '');\n    li.innerHTML = `<span class=\"info\">W${w.id} — ${w.wall} wall, ${w.width}m wide @${w.sillHeight}m sill<\u002Fspan>\n      <button class=\"rm\" title=\"Remove\">✕<\u002Fbutton>`;\n    li.addEventListener('click', e => {\n      if (e.target.classList.contains('rm')) { removeWindow(w.id); return; }\n      selectWindow(w.id);\n    });\n    ul.appendChild(li);\n  }\n  updateSunInfo();\n}\n\n// ── Wall-snap for place-window mode ──────────────────────────\n\nfunction getAllWallEdges() {\n  const rw = roomW(), rd = roomD();\n  const edges = [];\n\n  if (state.roomPolygon.length >= 3) {\n    // Polygon walls\n    const poly = state.roomPolygon;\n    for (let i = 0; i < poly.length; i++) {\n      const a = poly[i], b = poly[(i + 1) % poly.length];\n      edges.push({ x1: a.x, y1: a.y, x2: b.x, y2: b.y, wallId: `poly_${i}` });\n    }\n  } else {\n    // Rectangle edges\n    edges.push({ x1: 0,  y1: 0,  x2: rw, y2: 0,  wallId: 'N' });\n    edges.push({ x1: rw, y1: 0,  x2: rw, y2: rd, wallId: 'E' });\n    edges.push({ x1: 0,  y1: rd, x2: rw, y2: rd, wallId: 'S' });\n    edges.push({ x1: 0,  y1: 0,  x2: 0,  y2: rd, wallId: 'W' });\n  }\n  return edges;\n}\n\nfunction snapToWall(wx, wy) {\n  const edges = getAllWallEdges();\n  const rw = roomW(), rd = roomD();\n  // Room interior reference point — used to ensure the inward normal always\n  // points toward the inside of the room regardless of edge traversal direction.\n  let cx = rw / 2, cy = rd / 2;\n  if (state.roomPolygon.length >= 3) {\n    cx = state.roomPolygon.reduce((s, p) => s + p.x, 0) / state.roomPolygon.length;\n    cy = state.roomPolygon.reduce((s, p) => s + p.y, 0) / state.roomPolygon.length;\n  }\n\n  let bestDist = Infinity, bestSnap = null;\n\n  for (const e of edges) {\n    const dx = e.x2 - e.x1, dy = e.y2 - e.y1;\n    const len2 = dx*dx + dy*dy;\n    if (len2 < 1e-10) continue;\n    const t = Math.max(0, Math.min(1, ((wx - e.x1)*dx + (wy - e.y1)*dy) / len2));\n    const sx = e.x1 + t*dx, sy = e.y1 + t*dy;\n    const dist = Math.hypot(wx - sx, wy - sy);\n    if (dist < bestDist) {\n      bestDist = dist;\n      let nx = -dy / Math.sqrt(len2), ny = dx / Math.sqrt(len2);\n      // Flip if the candidate normal points away from the room interior.\n      if (nx * (cx - sx) + ny * (cy - sy) < 0) { nx = -nx; ny = -ny; }\n      const angle = Math.atan2(dy, dx);\n      bestSnap = { x: sx, y: sy, t, edge: e, inwardNx: nx, inwardNy: ny, angle, dist };\n    }\n  }\n  return bestSnap;\n}\n\nfunction getWallIdForEdge(edge) {\n  if (edge.wallId === 'N') return 'N';\n  if (edge.wallId === 'E') return 'E';\n  if (edge.wallId === 'S') return 'S';\n  if (edge.wallId === 'W') return 'W';\n  return edge.wallId; // polygon wall identifier\n}\n\n// Window spec fields sync to selected window\n['win-wall','win-pos','win-width','win-height','win-sill','win-transmit'].forEach(id => {\n  document.getElementById(id).addEventListener('change', () => {\n    const win = state.windows.find(w => w.id === state.selectedWindowId);\n    if (!win) return;\n    recordHistory();\n    win.wall          = document.getElementById('win-wall').value;\n    win.position      = parseFloat(document.getElementById('win-pos').value)     || 1;\n    win.width         = parseFloat(document.getElementById('win-width').value)   || 1.5;\n    win.height        = parseFloat(document.getElementById('win-height').value)  || 1.2;\n    win.sillHeight    = parseFloat(document.getElementById('win-sill').value)    || 0.9;\n    win.transmittance = parseFloat(document.getElementById('win-transmit').value)|| 0.7;\n    invalidateSim(); refreshWindowList(); draw(); scheduleAutoSave();\n  });\n});\n\ndocument.getElementById('btn-add-window').addEventListener('click', addWindow);\ndocument.getElementById('btn-place-window-mode').addEventListener('click', () => setMode('place-window'));\ndocument.getElementById('tool-place-window').addEventListener('click', () => setMode('place-window'));\n\n// Sun config fields\n['sun-date','sun-time','sun-north','sun-lat','sun-lon'].forEach(id => {\n  document.getElementById(id).addEventListener('change', () => {\n    state.sunConfig.date       = document.getElementById('sun-date').value;\n    state.sunConfig.time       = parseFloat(document.getElementById('sun-time').value)  || 12;\n    state.sunConfig.northAngle = parseFloat(document.getElementById('sun-north').value) || 0;\n    state.sunConfig.lat        = parseFloat(document.getElementById('sun-lat').value)   || 51.5;\n    state.sunConfig.lon        = parseFloat(document.getElementById('sun-lon').value)   || -0.1;\n    if (state.windows.length > 0) invalidateSim();\n    updateSunInfo(); scheduleAutoSave();\n  });\n});\n\nfunction getDayOfYear(dateStr) {\n  const d = new Date(dateStr);\n  const start = new Date(d.getFullYear(), 0, 0);\n  return Math.floor((d - start) / 86400000);\n}\n\nfunction calcSunPosition(lat, lon, dateStr, solarHour) {\n  const doy = getDayOfYear(dateStr);\n  const latR = lat * Math.PI / 180;\n  const B = (360 / 365 * (doy - 81)) * Math.PI / 180;\n  const declR = Math.asin(Math.sin(23.45 * Math.PI / 180) * Math.sin(B));\n  const hourAngle = (solarHour - 12) * 15 * Math.PI / 180;\n  const sinAlt = Math.sin(latR)*Math.sin(declR) + Math.cos(latR)*Math.cos(declR)*Math.cos(hourAngle);\n  const altitude = Math.asin(Math.max(-1, Math.min(1, sinAlt)));\n  const cosAz = (Math.sin(declR) - Math.sin(altitude)*Math.sin(latR)) / (Math.cos(altitude)*Math.cos(latR) + 1e-10);\n  let azimuth = Math.acos(Math.max(-1, Math.min(1, cosAz)));\n  if (hourAngle > 0) azimuth = 2*Math.PI - azimuth;\n  return { altitude, azimuth };\n}\n\nfunction updateSunInfo() {\n  const el = document.getElementById('sun-info');\n  if (!el) return;\n  const { altitude, azimuth } = calcSunPosition(\n    state.sunConfig.lat, state.sunConfig.lon, state.sunConfig.date, state.sunConfig.time);\n  const altDeg = (altitude * 180 / Math.PI).toFixed(1);\n  const azDeg  = ((azimuth * 180 / Math.PI + 360) % 360).toFixed(1);\n  const dirs   = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];\n  const dir    = dirs[Math.round(parseFloat(azDeg)/22.5) % 16];\n  el.textContent = altitude > 0\n    ? `Sun ${altDeg}° alt · ${azDeg}° ${dir}`\n    : `Sun below horizon (${altDeg}°)`;\n}\n\nfunction getWinEdgeGeometry(win, rw, rd) {\n  if (win.edgeX1 !== undefined) {\n    return {\n      x1: win.edgeX1, y1: win.edgeY1, x2: win.edgeX2, y2: win.edgeY2,\n      inx: win.inwardNx, iny: win.inwardNy,\n    };\n  }\n  switch(win.wall) {\n    case 'N': return { x1:0,  y1:0,  x2:rw, y2:0,  inx:0,  iny:1  };\n    case 'S': return { x1:0,  y1:rd, x2:rw, y2:rd, inx:0,  iny:-1 };\n    case 'E': return { x1:rw, y1:0,  x2:rw, y2:rd, inx:-1, iny:0  };\n    case 'W': return { x1:0,  y1:0,  x2:0,  y2:rd, inx:1,  iny:0  };\n  }\n}\n\nfunction computeWindowsLux(windows, sunCfg, rw, rd, wPlane, cols, rows, resolution) {\n  const grid = new Float32Array(cols * rows);\n  const { altitude, azimuth } = calcSunPosition(sunCfg.lat, sunCfg.lon, sunCfg.date, sunCfg.time);\n  const na = sunCfg.northAngle * Math.PI / 180;\n\n  // Sun direction in room coordinates (downward ray, i.e. direction sunlight travels)\n  // World frame: E=East, N=North. Sun direction toward earth: (sinAz*cosAlt, cosAz*cosAlt, -sinAlt)\n  // Room frame vs world frame (northAngle = angle of room-top from North, CW):\n  //   roomX_in_world = (cos(na), -sin(na)) in (E,N)\n  //   roomY_in_world = (-sin(na), -cos(na)) in (E,N)\n  // Inverse: world(E,N) -> room(x,y):\n  //   room_x = cos(na)*E - sin(na)*N\n  //   room_y = -sin(na)*E - cos(na)*N\n  // Direction sunlight TRAVELS (from sun toward ground) — negated from the\n  // toward-sun vector so it stays consistent with the downward sunRoomZ below.\n  // Without this, direct sun leaked through walls it was actually behind.\n  const sunWorldE = -Math.sin(azimuth) * Math.cos(altitude);\n  const sunWorldN = -Math.cos(azimuth) * Math.cos(altitude);\n  const sunRoomX  =  Math.cos(na) * sunWorldE - Math.sin(na) * sunWorldN; // +x component of sun ray\n  const sunRoomY  = -Math.sin(na) * sunWorldE - Math.cos(na) * sunWorldN; // +y component\n  const sunRoomZ  = -Math.sin(altitude); // downward (negative z = toward floor)\n\n  for (const win of windows) {\n    const { x1: ex1, y1: ey1, x2: ex2, y2: ey2, inx, iny } = getWinEdgeGeometry(win, rw, rd);\n    const edgeDx = ex2 - ex1, edgeDy = ey2 - ey1;\n    const edgeLen = Math.hypot(edgeDx, edgeDy);\n    if (edgeLen < 1e-6) continue;\n    const tx = edgeDx / edgeLen, ty = edgeDy / edgeLen; // unit vector along wall\n\n    // Outward wall normal\n    const outNx = -inx, outNy = -iny;\n    const wallD = outNx * ex1 + outNy * ey1; // signed distance from origin to wall plane\n\n    // ── DIRECT SUN: parallel ray tracing (creates a moving patch) ──────────\n    if (altitude > 0) {\n      const denom = outNx * sunRoomX + outNy * sunRoomY;\n      if (denom < -1e-10) {\n        // 8000 lx base: physically DNI would be ~90 000 lx, but interior\n        // sims use a design-equivalent scale that keeps sun vs. artificial\n        // lights in a useful visual ratio (~5–10×).\n        const E_patch = 8000 * Math.sin(altitude) * win.transmittance;\n        // Soft-edge blend widths (metres) so the patch fades at boundaries\n        // rather than cutting off sharply.\n        const softenW = 0.25;\n        const softenZ = 0.20;\n\n        for (let r = 0; r < rows; r++) {\n          const fpy = (r + 0.5) * resolution;\n          for (let c = 0; c < cols; c++) {\n            const fpx = (c + 0.5) * resolution;\n            const t = (outNx * fpx + outNy * fpy - wallD) / denom;\n            if (t <= 0) continue;\n\n            const hitX = fpx - t * sunRoomX;\n            const hitY = fpy - t * sunRoomY;\n            const hitZ = wPlane - t * sunRoomZ;\n\n            const along = (hitX - ex1) * tx + (hitY - ey1) * ty;\n            // Signed distance from each of the 4 window edges, normalised to\n            // [0,1] over the blend width — gives smooth penumbra at all edges.\n            const fW1 = Math.min(1, Math.max(0, (along - win.position)                     / softenW));\n            const fW2 = Math.min(1, Math.max(0, (win.position + win.width  - along)        / softenW));\n            const fZ1 = Math.min(1, Math.max(0, (hitZ - win.sillHeight)                    / softenZ));\n            const fZ2 = Math.min(1, Math.max(0, (win.sillHeight + win.height - hitZ)       / softenZ));\n            const coverage = fW1 * fW2 * fZ1 * fZ2;\n            if (coverage <= 0) continue;\n\n            grid[r * cols + c] += E_patch * coverage;\n          }\n        }\n      }\n    }\n\n    // ── DIFFUSE SKY: Lambertian area source from window face ─────────────────\n    // Daytime sky: ~2000 lx (design scale, ~25 % of peak direct sun).\n    // Twilight: 500 lx.  This seeds the multi-bounce radiosity pass in simulate().\n    const E_sky = (altitude > 0 ? 2000 : altitude > -0.1 ? 500 : 0) * win.transmittance;\n    if (E_sky > 0) {\n      const L_win = E_sky / Math.PI;\n      const nW = Math.max(2, Math.ceil(win.width  / 0.6));\n      const nH = Math.max(2, Math.ceil(win.height / 0.6));\n      const dA = (win.width * win.height) / (nW * nH);\n      const samples = [];\n      for (let ih = 0; ih < nH; ih++) {\n        const sz = win.sillHeight + (ih + 0.5) * win.height / nH;\n        for (let iw = 0; iw < nW; iw++) {\n          const sPos = win.position + (iw + 0.5) * win.width / nW;\n          samples.push({ x: ex1 + sPos * tx, y: ey1 + sPos * ty, z: sz });\n        }\n      }\n      for (let r = 0; r < rows; r++) {\n        const py = (r + 0.5) * resolution;\n        for (let c = 0; c < cols; c++) {\n          const px = (c + 0.5) * resolution;\n          let E = 0;\n          for (const s of samples) {\n            const dx = px - s.x, dy = py - s.y, dz = wPlane - s.z;\n            const r2 = dx*dx + dy*dy + dz*dz;\n            if (r2 < 1e-6) continue;\n            const r1 = Math.sqrt(r2);\n            const cosFloor = -dz / r1;   // window is above work plane, dz<0\n            const cosWin   = (dx * inx + dy * iny) / r1;\n            if (cosFloor <= 0 || cosWin <= 0) continue;\n            E += L_win * cosFloor * cosWin / r2 * dA;\n          }\n          grid[r * cols + c] += Math.max(0, E);\n        }\n      }\n    }\n\n  }\n  return grid;\n}\n\nfunction placeWindowAtSnap(snap) {\n  if (!snap) return;\n  recordHistory();\n  const halfW = (parseFloat(document.getElementById('win-width').value) || 1.5) / 2;\n  const edgeDx = snap.edge.x2 - snap.edge.x1;\n  const edgeDy = snap.edge.y2 - snap.edge.y1;\n  const edgeLen = Math.hypot(edgeDx, edgeDy);\n  const posAlongEdge = snap.t * edgeLen - halfW; // position of window start from edge start\n\n  const win = {\n    id:           state.nextWindowId++,\n    wall:         getWallIdForEdge(snap.edge),\n    position:     Math.max(0, posAlongEdge),\n    width:        parseFloat(document.getElementById('win-width').value)   || 1.5,\n    height:       parseFloat(document.getElementById('win-height').value)  || 1.2,\n    sillHeight:   parseFloat(document.getElementById('win-sill').value)    || 0.9,\n    transmittance:parseFloat(document.getElementById('win-transmit').value)|| 0.7,\n    // Store raw edge info for polygon walls so computeWindowsLux can use it\n    edgeX1: snap.edge.x1, edgeY1: snap.edge.y1,\n    edgeX2: snap.edge.x2, edgeY2: snap.edge.y2,\n    inwardNx: snap.inwardNx, inwardNy: snap.inwardNy,\n  };\n  // Update sidebar fields to match\n  document.getElementById('win-wall').value     = win.wall;\n  document.getElementById('win-pos').value      = win.position.toFixed(2);\n  state.windows.push(win);\n  state.selectedWindowId = win.id;\n  invalidateSim(); refreshWindowList(); draw(); scheduleAutoSave();\n}\n\nfunction drawWindows() {\n  if (!state.windows.length && !state.windowSnap) return;\n  const rw = roomW(), rd = roomD();\n  ctx.save();\n\n  for (const win of state.windows) {\n    const isSel = win.id === state.selectedWindowId;\n    const { x1: ex1, y1: ey1, x2: ex2, y2: ey2 } = getWinEdgeGeometry(win, rw, rd);\n    const edgeDx = ex2 - ex1, edgeDy = ey2 - ey1;\n    const edgeLen = Math.hypot(edgeDx, edgeDy);\n    if (edgeLen < 1e-6) continue;\n    const tx = edgeDx / edgeLen, ty = edgeDy / edgeLen;\n    const wx1 = ex1 + win.position * tx,        wy1 = ey1 + win.position * ty;\n    const wx2 = ex1 + (win.position + win.width) * tx, wy2 = ey1 + (win.position + win.width) * ty;\n    const [cx1, cy1] = w2c(wx1, wy1), [cx2, cy2] = w2c(wx2, wy2);\n    ctx.strokeStyle = isSel ? '#66e6ff' : '#00ccff';\n    ctx.lineWidth   = isSel ? 5 : 3;\n    ctx.lineCap     = 'round';\n    ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(cx2, cy2); ctx.stroke();\n    ctx.lineCap = 'butt';\n    ctx.fillStyle = isSel ? '#66e6ff' : '#00ccff';\n    ctx.font = '10px Segoe UI,sans-serif'; ctx.textAlign = 'center';\n    ctx.fillText(`W${win.id}`, (cx1 + cx2) / 2, (cy1 + cy2) / 2 - 6);\n  }\n\n  // Place-window snap preview\n  if (state.mode === 'place-window' && state.windowSnap) {\n    const snap = state.windowSnap;\n    const halfW = (parseFloat(document.getElementById('win-width').value) || 1.5) / 2;\n    const { x1: ex1, y1: ey1, x2: ex2, y2: ey2 } = snap.edge;\n    const edgeDx = ex2 - ex1, edgeDy = ey2 - ey1;\n    const edgeLen = Math.hypot(edgeDx, edgeDy);\n    const tx = edgeDx / edgeLen, ty = edgeDy / edgeLen;\n    const posStart = snap.t * edgeLen - halfW;\n    const wx1 = ex1 + posStart * tx,             wy1 = ey1 + posStart * ty;\n    const wx2 = ex1 + (posStart + halfW * 2) * tx, wy2 = ey1 + (posStart + halfW * 2) * ty;\n    const [px1, py1] = w2c(wx1, wy1), [px2, py2] = w2c(wx2, wy2);\n    ctx.strokeStyle = 'rgba(68,255,255,0.6)';\n    ctx.lineWidth   = 4;\n    ctx.lineCap     = 'round';\n    ctx.setLineDash([6, 3]);\n    ctx.beginPath(); ctx.moveTo(px1, py1); ctx.lineTo(px2, py2); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.lineCap = 'butt';\n  }\n\n  ctx.restore();\n}\n\n// ═══════════════════════════════════════════════════════════════\n// LEAFLET MAP\n// ═══════════════════════════════════════════════════════════════\n\nlet _leafletMap = null, _leafletMarker = null;\n\ndocument.getElementById('btn-pick-location').addEventListener('click', openMapModal);\ndocument.getElementById('btn-close-map').addEventListener('click', closeMapModal);\n\nfunction openMapModal() {\n  document.getElementById('map-modal').classList.add('open');\n  if (!_leafletMap) {\n    initLeafletMap();\n  } else {\n    _leafletMap.invalidateSize();\n    const lat = parseFloat(document.getElementById('sun-lat').value) || 51.5;\n    const lon = parseFloat(document.getElementById('sun-lon').value) || -0.1;\n    _leafletMap.setView([lat, lon], _leafletMap.getZoom());\n  }\n}\n\nfunction closeMapModal() {\n  document.getElementById('map-modal').classList.remove('open');\n}\n\nfunction initLeafletMap() {\n  const lat = parseFloat(document.getElementById('sun-lat').value) || 51.5;\n  const lon = parseFloat(document.getElementById('sun-lon').value) || -0.1;\n  _leafletMap = L.map('leaflet-map').setView([lat, lon], 4);\n  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {\n    attribution: '© OpenStreetMap',\n    maxZoom: 18,\n  }).addTo(_leafletMap);\n  _leafletMarker = L.marker([lat, lon]).addTo(_leafletMap);\n  _leafletMap.on('click', e => {\n    const { lat, lng } = e.latlng;\n    _leafletMarker.setLatLng([lat, lng]);\n    document.getElementById('sun-lat').value = lat.toFixed(4);\n    document.getElementById('sun-lon').value = lng.toFixed(4);\n    document.getElementById('map-coords').textContent = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;\n    state.sunConfig.lat = lat;\n    state.sunConfig.lon = lng;\n    updateSunInfo();\n    if (state.windows.length > 0) invalidateSim();\n    scheduleAutoSave();\n  });\n  document.getElementById('map-coords').textContent = `${lat.toFixed(4)}°, ${lon.toFixed(4)}°`;\n}\n\n// ═══════════════════════════════════════════════════════════════\n// INIT\n// ═══════════════════════════════════════════════════════════════\n\n// Sync sun-date input default to today\ndocument.getElementById('sun-date').value = state.sunConfig.date;\n\n// Load auto-saved project (if any), then push initial history entry\nloadAutoSave();\nupdateUndoButtons();\nrefreshScenarioList();\nrefreshWindowList();\nupdateSunInfo();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
